<script>
  const token = localStorage.getItem('pac_token') || '';
  let _usuario = null, _ctx = null, _dados = null;
  const PAGINA_ATUAL = 'empenhos';

  // ── Utilitários ───────────────────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function fmtV(v) { return 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fmtN(v) { return Number(v || 0).toLocaleString('pt-BR', { maximumFractionDigits: 3 }); }
  function fmtD(d) { if (!d) return '—'; const s = String(d).slice(0, 10); return s.slice(8,10) + '/' + s.slice(5,7) + '/' + s.slice(0,4); }
  function fmtDH(d) { if (!d) return '—'; try { return new Date(d).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }); } catch (e) { return '—'; } }
  function diasDesde(d) { if (!d) return ''; const n = Math.floor((Date.now() - new Date(d).getTime()) / 864e5); return n <= 0 ? 'hoje' : n === 1 ? 'há 1 dia' : 'há ' + n + ' dias'; }
  function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }

  const SIT_REQ = { aguardando_contratacao: 'Pendente: aguarda contratação', aguardando_gestor: 'Aguardando o gestor',

    $('sidebar').innerHTML = '<div class="nav-titulo" style="margin-top:8px">Menu</div>' + menus.map(m =>

    _ctx = await chamar('emp_contexto');

    popularSeletorExercicios(_ctx.exercicio);
    iniciarPagina();
  })();
  const SIT_SOL = { elaboracao: 'Em elaboração', enviada: 'Enviada ao Orçamento', empenhada_parcial: 'Empenhada em parte',

  function stSol(s) { return `<span class="st st-sol-${s}">${esc(SIT_SOL[s] || s)}</span>`; }

  function stSol(s) { return `<span class="st st-sol-${s}">${esc(SIT_SOL[s] || s)}</span>`; }
  const ORIGENS = {};
  let _aba = 'solicitacoes';
  const pode = () => _ctx && _ctx.pode_editar;

  function iniciarPagina() {

  async function carregar() {

  function mostrarAba(aba) {

  const soma = (l, k) => l.reduce((t, x) => t + Number(x[k] || 0), 0);

      <div class="card ${Math.abs(t.sem_vinculo) > 0.005 ? 'vermelho' : ''}"><div class="card-label">Empenho sem vínculo</div><div class="card-valor">${fmtV(t.sem_vinculo)}</div><div class="card-det">deve ser zero</div></div>

  // ── Solicitações ──────────────────────────────────────────────────────────
  function renderSolicitacoes() {
    const S = _dados.solicitacoes;

        ${l.map(s => `<tr class="clicavel" onclick="verSolicitacao('${s.id_solicitacao}')">

          <td>${esc(s.sigla_gestora)}</td>
          <td>${s.numero_instrumento ? `${esc(TIPOS_INST[s.tipo_instrumento]||'')} ${esc(s.numero_instrumento)}<span class="sub">${esc(s.fornecedor_nome||'')}</span>` : esc(FORMAS[s.forma]||s.forma)}</td>
          <td class="num">${fmtV(s.total_real)}</td><td class="num">${fmtV(s.empenhado)}</td>
          <td class="num">${s.a_empenhar > 0.005 ? `<b>${fmtV(s.a_empenhar)}</b>` : '—'}</td>
          <td>${fmtD(s.data_envio)}<span class="dias">${diasDesde(s.data_envio)}</span>${s.situacao === 'devolvida' ? `<span class="sub" style="color:#A32D2D">${esc(s.motivo||'')}</span>` : ''}</td>
          <td style="text-align:right;white-space:nowrap" onclick="event.stopPropagation()">
            ${s.situacao === 'enviada' && s.a_empenhar > 0.005 ? `<button class="btn btn-p btn-mini so-editor" onclick="registrarEmpenho(null,'${s.id_solicitacao}')">Registrar empenho</button>` : ''}
            <button class="btn btn-mini" onclick="verSolicitacao('${s.id_solicitacao}')">Abrir</button></td></tr>`).join('')}
        </tbody></table>` : '<div class="vazio" style="padding:14px">Nenhuma.</div>'}</div></div>`).join('');
  }

  async function verSolicitacao(id) {
    abrirModal('Solicitação de empenho', '<div class="carregando">Carregando…</div>', true);
    const r = await chamar('sol_detalhe', { id_solicitacao: id });
    if (!r.ok) return erroModal(r.erro);
    window._sol = r;
    const s = r.solicitacao, R = r.requisicoes;
    $('modal-titulo').innerHTML = `<span class="cod-dem">${esc(s.codigo)}</span> ${esc(s.sigla_gestora)} · ${s.numero_instrumento ? esc(TIPOS_INST[s.tipo_instrumento]||'') + ' ' + esc(s.numero_instrumento) : esc(FORMAS[s.forma]||'')} ${stSol(s.situacao_exibicao)}`;
    $('modal-corpo').innerHTML = `
      ${s.situacao === 'devolvida' ? `<div class="aviso"><b>Devolvida à seção gestora:</b> ${esc(s.motivo||'')}</div>` : ''}
      <div class="kv">
        ${s.numero_instrumento ? `<div><span>Fornecedor</span><b>${esc(s.fornecedor_nome||'—')}</b>${s.fornecedor_cnpj ? '<br>' + esc(s.fornecedor_cnpj) : ''}</div>
        <div><span>Objeto</span>${esc(s.objeto_instrumento||'')}</div><div><span>Processo SUAP</span>${esc(s.processo_sei_instrumento||'—')}</div>` : ''}
        <div><span>Valor real</span><b>${fmtV(s.total_real)}</b></div><div><span>Empenhado</span><b>${fmtV(s.empenhado)}</b></div>
        <div><span>A empenhar</span><b>${fmtV(s.a_empenhar)}</b></div><div><span>Enviada</span>${fmtDH(s.data_envio)}<br>${esc(s.nome_envio||'')}</div>
        ${s.observacao ? `<div style="grid-column:1/-1"><span>Observação</span>${esc(s.observacao)}</div>` : ''}
      </div>
      <div class="bloco"><div class="bloco-titulo">Requisições</div><div class="caixa tabela-scroll"><table>
        <thead><tr><th>Requisição</th><th>Unidade</th><th>Objeto</th><th>Natureza</th><th class="num">Real</th><th class="num">Empenhado</th><th>Empenhos</th></tr></thead><tbody>
        ${R.map(x => `<tr><td><span class="cod-req">${esc(x.codigo)}</span><span class="sub">${esc(x.codigo_demanda)}</span></td>
          <td>${esc(x.sigla_unidade)}</td><td style="max-width:220px">${esc(x.descricao_objeto)}</td><td>${esc(x.natureza_despesa||'—')}</td>
          <td class="num">${fmtV(x.valor_real)}</td><td class="num">${fmtV(x.empenhado)}</td>
          <td>${x.empenhos.map(e => `<a href="#" onclick="verEmpenho('${e.id_empenho}');return false;">${esc(e.numero)}</a> <span class="sub" style="display:inline">${fmtV(e.valor)}</span>`).join('<br>') || '—'}</td></tr>`).join('')}
        </tbody></table></div></div>
      <div class="bloco so-editor" id="bloco-devolver" style="display:none"><div class="bloco-titulo">Devolver à seção gestora</div>
        <div class="campo"><textarea id="dev-motivo" rows="2" placeholder="Ex.: sem crédito disponível na ação; natureza de despesa divergente"></textarea></div>
        <div class="rodape" style="margin-top:8px"><button class="btn btn-r" onclick="devolver('${s.id_solicitacao}')">Confirmar devolução</button></div></div>
      <div class="rodape">
        ${s.situacao === 'enviada' && s.a_empenhar > 0.005 ? `<button class="btn btn-r so-editor" style="margin-right:auto" onclick="$('bloco-devolver').style.display='';$('dev-motivo').focus()">Devolver</button>` : ''}

  }
  async function devolver(id) {
    const m = $('dev-motivo').value.trim();
    if (m.length < 5) return erroModal('Escreva o motivo da devolução.');
    const r = await chamar('sol_acao', { id_solicitacao: id, acao: 'devolver', motivo: m });
    if (!r.ok) return erroModal(r.erro);
    fecharModal(); toast('Solicitação devolvida à seção gestora.'); carregar();
  }

  // ── Registrar / editar empenho ────────────────────────────────────────────
  // Por padrão cobre todas as requisições da solicitação, pelo que falta empenhar
  // de cada uma; o Orçamento pode desmarcar, reduzir ou incluir outras.
  async function registrarEmpenho(idEmpenho, idSol) {
    let e = {}, cobAtual = [];
    if (idEmpenho) {
      const r = await chamar('emp_detalhe', { id_empenho: idEmpenho });
      if (!r.ok) return toast(r.erro);
      e = r.empenho; cobAtual = r.cobertura;
    }
    const R = _dados.requisicoes;
    const restante = x => Math.max(0, Number(x.valor_real || 0) - Number(x.empenhado || 0));
    const linhasIni = [];
    cobAtual.forEach(c => { const x = R.find(r => r.id_requisicao === c.id_requisicao) || c.requisicao; linhasIni.push({ x, valor: c.valor, max: restante(x) + c.valor, marcado: true }); });
    let sol = null;
    if (idSol) {
      sol = _dados.solicitacoes.find(s => s.id_solicitacao === idSol);
      R.filter(x => x.id_solicitacao === idSol && restante(x) > 0.005 && !linhasIni.some(l => l.x.id_requisicao === x.id_requisicao))
        .forEach(x => linhasIni.push({ x, valor: restante(x), max: restante(x), marcado: true }));
    }
    window._cob = linhasIni;
    const nd = [...new Set(linhasIni.map(l => l.x.natureza_despesa).filter(Boolean))];
    const ref = sol || (linhasIni[0] ? _dados.solicitacoes.find(s => s.id_solicitacao === linhasIni[0].x.id_solicitacao) : null);
    const val = k => esc(e[k] != null ? e[k] : '');
    const totalIni = linhasIni.reduce((t, l) => t + l.valor, 0);
    abrirModal(idEmpenho ? `Editar empenho ${esc(e.numero)}` : `Registrar empenho${sol ? ` — <span class="cod-dem">${esc(sol.codigo)}</span>` : ''}`, `
      <div class="form">
        <div class="campo"><label>Número *</label><input id="e-numero" value="${val('numero')}" placeholder="2026NE000123"></div>
        <div class="campo"><label>Data de emissão *</label><input type="date" id="e-data" value="${val('data_emissao') || new Date().toISOString().slice(0,10)}"></div>
        <div class="campo"><label>Valor empenhado (R$) *</label><input type="number" step="0.01" min="0" id="e-valor" value="${e.valor_empenhado != null ? e.valor_empenhado : (totalIni ? totalIni.toFixed(2) : '')}" oninput="somarCob()"></div>
        <div class="campo"><label>Origem do crédito</label><select id="e-origem"><option value="">—</option>${(_ctx.origens||[]).map(o => `<option value="${o.valor}"${e.origem===o.valor?' selected':''}>${esc(o.nome)}</option>`).join('')}</select></div>
        <div class="campo"><label>Fonte</label><select id="e-fonte"><option value="">—</option>${(_ctx.fontes||[]).map(f => `<option value="${f.codigo}"${e.fonte_codigo===f.codigo?' selected':''}>${esc(f.codigo)} — ${esc(f.nome)}</option>`).join('')}</select></div>
        <div class="campo"><label>Ação de governo</label><input id="e-acao" value="${val('acao_governo')}" placeholder="Ex.: 20RL"></div>
        <div class="campo"><label>Natureza de despesa</label><input id="e-nd" value="${e.natureza_despesa != null ? esc(e.natureza_despesa) : esc(nd.length === 1 ? nd[0] : '')}" placeholder="Ex.: 3.3.90.30"></div>
        <div class="campo"><label>Favorecido (CNPJ)</label><input id="e-cnpj" value="${e.favorecido_cnpj != null ? esc(e.favorecido_cnpj) : esc(ref && ref.fornecedor_cnpj || '')}"></div>
        <div class="campo"><label>Favorecido (nome)</label><input id="e-fav" value="${e.favorecido_nome != null ? esc(e.favorecido_nome) : esc(ref && ref.fornecedor_nome || '')}"></div>
        <div class="campo largo"><label>Observação</label><input id="e-obs" value="${val('observacao')}"></div>
      </div>
      <input type="hidden" id="e-inst" value="${esc(e.id_instrumento || (ref && ref.id_instrumento) || '')}">
      <div class="bloco" style="margin-top:16px"><div class="bloco-titulo">O que este empenho cobre
        <select id="e-add" class="btn" style="margin-left:auto" onchange="incluirReq(this.value);this.value=''"><option value="">+ incluir requisição de outra solicitação…</option>
          ${R.filter(x => x.situacao_solicitacao === 'enviada' && restante(x) > 0.005 && !linhasIni.some(l => l.x.id_requisicao === x.id_requisicao))
             .map(x => `<option value="${x.id_requisicao}">${esc(x.codigo_solicitacao)} · ${esc(x.codigo)} · ${esc(x.sigla_unidade)} · falta ${fmtV(restante(x))}</option>`).join('')}</select></div>
        <div class="caixa tabela-scroll"><table><thead><tr><th></th><th>Requisição</th><th>Unidade</th><th>Natureza</th><th class="num">Valor real</th><th class="num">Falta empenhar</th><th class="num">Valor coberto</th></tr></thead>
          <tbody id="cob-corpo"></tbody></table></div>
        <div id="cob-soma" style="margin-top:8px"></div>
      </div>
      <div class="rodape"><button class="btn" onclick="fecharModal()">Cancelar</button>
        <button class="btn btn-p" onclick="salvarEmpenho('${idEmpenho || ''}')">${idEmpenho ? 'Salvar alterações' : 'Registrar empenho'}</button></div>`, true);
    desenharCob();
  }
  function desenharCob() {
    $('cob-corpo').innerHTML = window._cob.map((l, i) => `<tr class="cob-linha">
      <td><input type="checkbox" ${l.marcado ? 'checked' : ''} onchange="window._cob[${i}].marcado=this.checked;somarCob()"></td>
      <td><span class="cod-req">${esc(l.x.codigo)}</span><span class="sub">${esc(l.x.codigo_solicitacao||'')} · ${esc(l.x.codigo_demanda||'')}</span></td>
      <td>${esc(l.x.sigla_unidade||'')}</td><td>${esc(l.x.natureza_despesa||'—')}</td>
      <td class="num">${fmtV(l.x.valor_real)}</td><td class="num">${fmtV(l.max)}</td>
      <td class="num"><input type="number" step="0.01" min="0" value="${Number(l.valor).toFixed(2)}" oninput="window._cob[${i}].valor=Number(this.value||0);somarCob()"></td></tr>`).join('')
      || '<tr><td colspan="7" class="vazio" style="padding:14px">Nenhuma requisição marcada. Inclua ao menos uma, ou registre o empenho e vincule depois.</td></tr>';
    somarCob();
  }
  function incluirReq(id) {
    if (!id) return;
    const x = _dados.requisicoes.find(r => r.id_requisicao === id);
    const falta = Math.max(0, Number(x.valor_real || 0) - Number(x.empenhado || 0));
    window._cob.push({ x, valor: falta, max: falta, marcado: true });
    const opt = document.querySelector(`#e-add option[value="${id}"]`); if (opt) opt.remove();
    desenharCob();
  }
  function somarCob() {
    const tot = window._cob.filter(l => l.marcado).reduce((t, l) => t + Number(l.valor || 0), 0);
    const v = Number($('e-valor').value || 0);
    const acima = window._cob.find(l => l.marcado && l.valor > l.max + 0.004);
    const dif = v - tot;
    $('cob-soma').innerHTML = acima ? `<div class="bad-box">${esc(acima.x.codigo)}: o valor coberto passa do que falta empenhar (${fmtV(acima.max)}).</div>`
      : Math.abs(dif) < 0.005 ? `<div class="ok-box">O empenho cobre exatamente ${fmtV(tot)} em ${window._cob.filter(l => l.marcado).length} requisição(ões).</div>`
      : dif > 0 ? `<div class="bad-box">Cobertura de ${fmtV(tot)}: ficam <b>${fmtV(dif)}</b> do empenho sem vínculo.</div>`
      : `<div class="bad-box">A cobertura (${fmtV(tot)}) passa do valor do empenho em <b>${fmtV(-dif)}</b>.</div>`;

  async function salvarEmpenho(id) {

      valor_empenhado: $('e-valor').value, origem: $('e-origem').value, fonte_codigo: $('e-fonte').value,
      acao_governo: $('e-acao').value, natureza_despesa: $('e-nd').value, favorecido_cnpj: $('e-cnpj').value,
      favorecido_nome: $('e-fav').value, observacao: $('e-obs').value, id_instrumento: $('e-inst').value };
    const cobertura = window._cob.filter(l => l.marcado && Number(l.valor) > 0).map(l => ({ id_requisicao: l.x.id_requisicao, valor: l.valor }));

  async function excluirMov(idMov, id) {

  async function excluirEmpenho(id) {
    if (!confirm('Excluir este empenho? O que ele cobre volta a ficar a empenhar.')) return;

    if (!r.ok) return erroModal(r.erro);

  function htmlConciliacao(cc) {
    const t = cc.total;
    const tab = (lista, rotulo) => lista.length ? `<table><thead><tr><th>${rotulo}</th><th class="num">Aprovado (real)</th><th class="num">Solicitado</th><th class="num">Empenhado</th><th class="num">A empenhar</th><th class="num">Liquidado</th><th></th></tr></thead><tbody>
      ${lista.map(x => `<tr><td>${esc(x.nome)}<span class="sub">${x.n} requisição(ões)</span></td>
        <td class="num">${fmtV(x.aprovado)}</td><td class="num">${fmtV(x.solicitado)}</td><td class="num">${fmtV(x.empenhado)}</td>
        <td class="num">${x.a_empenhar > 0.005 ? `<b style="color:#7A4A00">${fmtV(x.a_empenhar)}</b>` : '—'}</td>
        <td class="num">${fmtV(x.liquidado)}</td>
        <td style="min-width:90px">${barra(x.empenhado, x.aprovado)}</td></tr>`).join('')}
      <tr><td><b>Total</b></td><td class="num"><b>${fmtV(lista.reduce((s, x) => s + x.aprovado, 0))}</b></td><td class="num"><b>${fmtV(lista.reduce((s, x) => s + x.solicitado, 0))}</b></td>
        <td class="num"><b>${fmtV(lista.reduce((s, x) => s + x.empenhado, 0))}</b></td><td class="num"><b>${fmtV(lista.reduce((s, x) => s + x.a_empenhar, 0))}</b></td>
        <td class="num"><b>${fmtV(lista.reduce((s, x) => s + x.liquidado, 0))}</b></td><td></td></tr>
      </tbody></table>` : '<div class="vazio">Nenhuma requisição aprovada neste filtro.</div>';
    const bate = Math.abs(t.sem_vinculo) < 0.005;
    return `
      <div class="cadeia">
        <div class="elo"><span>Aprovado (real)</span><b>${fmtV(t.aprovado)}</b><small>requisições aprovadas</small></div>
        <div class="elo"><span>Solicitado</span><b>${fmtV(t.solicitado)}</b><small>em solicitação enviada</small></div>
        <div class="elo"><span>Empenhado</span><b>${fmtV(t.empenhado)}</b><small>o que os empenhos cobrem</small></div>

        <div class="elo" style="${bate ? '' : 'background:#FCEBEB'}"><span>Empenho sem vínculo</span><b class="${bate ? '' : 'alerta-num'}">${fmtV(t.sem_vinculo)}</b><small>${bate ? 'empenhos totalmente vinculados' : 'valor dos empenhos − o que cobrem'}</small></div>
      </div>
      ${!bate ? `<div class="aviso"><b>Há empenho sem vínculo.</b> A soma dos empenhos (${fmtV(t.empenhos)}) não bate com a soma do que eles cobrem (${fmtV(t.empenhado)}).
        ${cc.sem_vinculo.map(e => `<span class="cod-dem" style="margin-left:6px">${esc(e.numero)}: ${fmtV(e.sem_vinculo)}</span>`).join('')}</div>`
        : `<div class="ok-box" style="margin-bottom:18px">A soma dos empenhos é igual à soma do que eles cobrem nas requisições.</div>`}
      <div class="secao"><div class="secao-header"><span class="secao-titulo">Por contrato, ata ou forma de atendimento</span></div><div class="tabela-scroll">${tab(cc.por_instrumento, 'Instrumento')}</div></div>
      <div class="secao"><div class="secao-header"><span class="secao-titulo">Por unidade requerente</span></div><div class="tabela-scroll">${tab(cc.por_unidade, 'Unidade')}</div></div>`;
  }

  function analisar(id) {
    const x = _dados.requisicoes.find(r => r.id_requisicao === id);
    const inst = x.id_instrumento ? _dados.instrumentos.find(i => i.id_instrumento === x.id_instrumento) : null;
    const saldoInst = inst && inst.valor_limite != null ? Number(inst.saldo) + (x.situacao === 'aprovada' ? Number(x.valor_real || 0) : 0) : null;
    const unit = x.quantidade_demanda ? Number(x.valor_demanda) / Number(x.quantidade_demanda) : null;
    const pode = x.situacao === 'aguardando_gestor', aprovada = x.situacao === 'aprovada';
    abrirModal(`<span class="cod-req">${esc(x.codigo)}</span> ${esc(x.descricao_objeto)}<span class="sub">${esc(x.codigo_demanda)} · ${esc(x.nome_unidade)}</span>`, `

        <div><span>Unitário previsto</span><b>${unit ? fmtV(unit) : '—'}</b></div>

        ${saldoInst != null ? `<div><span>Saldo do instrumento</span><b>${fmtV(saldoInst)}</b></div>` : ''}
        ${x.observacao ? `<div class="largo"><span>Observação do requerente</span>${esc(x.observacao)}</div>` : ''}
        ${x.motivo ? `<div class="largo"><span>Motivo registrado</span>${esc(x.motivo)}</div>` : ''}
      </div>
      ${pode || aprovada ? `<div class="form">
        <div class="campo"><label>Valor real (R$) *</label><input type="number" min="0" step="0.01" id="an-real" value="${x.valor_real || ''}" oninput="conferir()" ${aprovada ? 'disabled' : ''}>
          <span class="hint">Preço do ${inst ? (inst.tipo === 'ata' ? 'item na ata' : 'contrato') : 'atendimento'} × quantidade pedida</span></div>
        <div class="campo" style="justify-content:flex-end"><div id="an-conf"></div></div>
        <div class="campo largo"><label>Motivo (obrigatório para devolver)</label><textarea id="an-motivo" rows="2" placeholder="Ex.: valor real supera o requisitado; readeque a quantidade"></textarea></div>
      </div>
      <div class="rodape">
        <button class="btn btn-r" style="margin-right:auto" onclick="decidir('${x.id_requisicao}','devolver')">Devolver ao requerente</button>
        ${aprovada ? `<button class="btn" onclick="decidir('${x.id_requisicao}','desfazer')">Voltar para análise</button>` : ''}
        <button class="btn" onclick="fecharModal()">Fechar</button>
        ${pode ? `<button class="btn btn-v" id="an-aprovar" onclick="decidir('${x.id_requisicao}','aprovar')" disabled>Aprovar</button>` : ''}
      </div>` : `<div class="rodape"><button class="btn" onclick="fecharModal()">Fechar</button></div>`}`, true);
    window._an = { x, saldoInst };
    if (pode) conferir();
  }
  function conferir() {
    const { x, saldoInst } = window._an;
    const v = Number($('an-real').value || 0), el = $('an-conf'), btn = $('an-aprovar');
    if (!v) { el.innerHTML = ''; if (btn) btn.disabled = true; return; }
    let html, ok = true;
    if (v > Number(x.valor) + 0.004) {
      ok = false; html = `<div class="bad-box">O valor real supera o requisitado em <b>${fmtV(v - Number(x.valor))}</b>. Não é possível aprovar: devolva para o requerente readequar a quantidade ou o valor.</div>`;
      if (!$('an-motivo').value) $('an-motivo').value = `O valor real (${fmtV(v)}) supera o requisitado (${fmtV(x.valor)}). Readeque a quantidade ou o valor dentro do saldo da demanda.`;
    } else if (saldoInst != null && v > saldoInst + 0.004) {
      ok = false; html = `<div class="bad-box">O instrumento tem só <b>${fmtV(saldoInst)}</b> de saldo. Devolva ou aguarde um aditivo.</div>`;
    } else {
      const r = Number(x.valor) - v;
      html = `<div class="ok-box">Cabe no requisitado${saldoInst != null ? ' e no saldo do instrumento' : ''}.${r > 0.004 ? ` Resíduo positivo: <b>${fmtV(r)}</b>.` : ''}</div>`;
    }
    el.innerHTML = html; if (btn) btn.disabled = !ok;
  }
  async function decidir(id, acao) {
    const motivo = $('an-motivo') ? $('an-motivo').value.trim() : '';
    if (acao === 'devolver' && motivo.length < 5) return erroModal('Escreva o motivo da devolução.');
    const r = await chamar('ped_analisar', { id_requisicao: id, acao, valor_real: $('an-real') ? $('an-real').value : null, motivo });
    if (!r.ok) return erroModal(r.erro);
    fecharModal();
    toast(acao === 'aprovar' ? 'Requisição aprovada' + (Number(r.residuo) > 0 ? ` — resíduo de ${fmtV(r.residuo)}` : '') + '.'
        : acao === 'devolver' ? 'Requisição devolvida ao requerente.' : 'Requisição voltou para análise.');
    carregar();
  }



</script>
</body>
</html>
