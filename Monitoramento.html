<style>

  .cod-req { display: inline-block; font-size: 10.5px; font-weight: 700; color: #085041; background: #E1F5EE; border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
  .aviso { background: #FCEBEB; border: 1px solid #F7C1C1; border-radius: 10px; padding: 12px 16px; margin-bottom: 18px; font-size: 13px; color: #791F1F; }
  .aviso b { color: #A32D2D; }
  .info { background: #F4F3FE; border: 1px solid #DAD7F7; border-radius: 10px; padding: 10px 14px; font-size: 12.5px; color: #3C3489; }
  .ok-box { background: #E1F5EE; border: 1px solid #B4E3D2; border-radius: 10px; padding: 10px 14px; font-size: 12.5px; color: #085041; }
  .bad-box { background: #FCEBEB; border: 1px solid #F7C1C1; border-radius: 10px; padding: 10px 14px; font-size: 12.5px; color: #791F1F; }
  .dados-dem { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 16px; background: #FAFAF8; border-radius: 10px; padding: 12px 14px; font-size: 12.5px; }
  .dados-dem span { display: block; font-size: 10.5px; color: #888780; text-transform: uppercase; letter-spacing: .3px; }
  .dados-dem b { font-weight: 600; }
  .dados-dem .largo { grid-column: 1 / -1; }
  .formas { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .forma { border: 1px solid #D3D1C7; border-radius: 9px; padding: 9px 11px; cursor: pointer; font-size: 12.5px; display: flex; gap: 8px; align-items: flex-start; }
  .forma:hover { background: #FAFAF8; }
  .forma input { margin-top: 2px; }
  .forma.sel { border-color: #534AB7; background: #F4F3FE; }
  .forma small { display: block; font-size: 11px; color: #888780; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; background: #FAEEDA; border-radius: 9px; padding: 10px 12px; color: #633806; }
  .inst-card { border-top: 3px solid #534AB7; }
  .inst-meta { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: #5F5E5A; }
  .inst-meta b { color: #2C2C2A; }
  .hist { font-size: 12.5px; }
  .hist div { padding: 8px 12px; border-bottom: 1px solid #F8F7F4; }
  .hist div:last-child { border-bottom: none; }
  .dias { font-size: 11px; color: #888780; }
  .btn:disabled, .btn:disabled:hover { opacity: .4; cursor: not-allowed; }
  .st-sol-elaboracao { background: #FAEEDA; color: #633806; } .st-sol-enviada { background: #E6F1FB; color: #0C447C; }
  .st-sol-empenhada_parcial { background: #EEEDFE; color: #3C3489; } .st-sol-empenhada { background: #E1F5EE; color: #085041; }
  .st-sol-devolvida { background: #FCEBEB; color: #791F1F; } .st-sol-cancelada { background: #F1EFE8; color: #888780; }

  .st-sol-elaboracao { background: #FAEEDA; color: #633806; } .st-sol-enviada { background: #E6F1FB; color: #0C447C; }
  .st-sol-empenhada_parcial { background: #EEEDFE; color: #3C3489; } .st-sol-empenhada { background: #E1F5EE; color: #085041; }
  .st-sol-devolvida { background: #FCEBEB; color: #791F1F; } .st-sol-cancelada { background: #F1EFE8; color: #888780; }
  .dm-sem_requisicao { background: #F1EFE8; color: #5F5E5A; } .dm-requisitada { background: #E6F1FB; color: #0C447C; }
  .dm-aprovada { background: #E1F5EE; color: #085041; } .dm-empenhada { background: #EEEDFE; color: #3C3489; }
  .dm-em_execucao { background: #FFF4D6; color: #7A4A00; }
  .dm-liquidada { background: #FAEEDA; color: #633806; } .dm-paga { background: #D7F0E6; color: #04342A; }

  .cadeia { display: flex; gap: 0; flex-wrap: wrap; margin-bottom: 18px; }
  .elo { flex: 1; min-width: 120px; background: #fff; border: 1px solid #D3D1C7; padding: 10px 12px; position: relative; }
  .elo:first-child { border-radius: 10px 0 0 10px; } .elo:last-child { border-radius: 0 10px 10px 0; }
  .elo + .elo { border-left: none; }
  .elo span { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .4px; color: #888780; font-weight: 600; }
  .elo b { display: block; font-size: 15px; margin-top: 3px; } .elo small { font-size: 11px; color: #888780; }

<div class="topbar">
  <span class="topbar-logo" title="Planejamento e Monitoramento Orçamentário">PMO</span>
  <span class="topbar-sub">Monitoramento da execução</span>
  <div style="display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:6px;padding:4px 10px;">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <select id="sel-exercicio" style="background:transparent;border:none;color:#fff;font-size:12px;font-weight:600;cursor:pointer;outline:none;padding:0 2px;" onchange="trocarExercicio(this.value)"></select>
  </div>
  <div class="topbar-spacer"></div>
  <div class="topbar-usuario">
    <div class="avatar" id="av">?</div>
    <div>
      <div style="font-weight:500" id="nome-usuario">Carregando...</div>
      <div style="font-size:11px;opacity:0.7" id="unidade-usuario"></div>
    </div>
    <button class="btn-logout" onclick="fazerLogout()">Sair</button>
  </div>
</div>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main">
    <div class="cabecalho">
      <div>
        <div class="page-title">Monitoramento da execução</div>
        <div class="page-sub">Demanda → requisição → solicitação → empenho → liquidação → pagamento — exercício <span id="exercicio-label">…</span></div>
      </div>
      <div class="escopo">
        <span class="selo" id="selo-modo" style="display:none"></span>
        <span id="caixa-escopo" style="display:none">Ver <select id="sel-escopo" onchange="carregar()"></select></span>
      </div>
    </div>
    <div class="abas" id="abas">
      <button class="aba ativa" data-aba="painel" onclick="mostrarAba('painel')">Painel</button>
      <button class="aba" data-aba="demandas" onclick="mostrarAba('demandas')">Demandas</button>
      <button class="aba" data-aba="requisicoes" onclick="mostrarAba('requisicoes')">Requisições</button>
      <button class="aba" data-aba="empenhos" onclick="mostrarAba('empenhos')">Empenhos</button>
      <button class="aba" data-aba="liquidacoes" onclick="mostrarAba('liquidacoes')">Liquidações e pagamentos</button>
      <button class="aba" data-aba="pendencias" onclick="mostrarAba('pendencias')">Pendências<span class="cnt" id="cnt-pend" style="display:none"></span></button>
      <button class="aba" data-aba="calendario" onclick="mostrarAba('calendario')">Calendário</button>
      <button class="aba" data-aba="residuos" onclick="mostrarAba('residuos')">Devolução à Reitoria</button>
    </div>
    <div id="conteudo"><div class="carregando">Carregando…</div></div>

  </main>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this) fecharModal()">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-titulo" id="modal-titulo"></div>
      <button class="modal-fechar" onclick="fecharModal()" aria-label="Fechar">×</button>
    </div>
    <div class="modal-corpo"><div class="msg-erro" id="modal-erro"></div><div id="modal-corpo"></div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  const token = localStorage.getItem('pac_token') || '';
  let _usuario = null, _ctx = null, _dados = null;
  const PAGINA_ATUAL = 'monitoramento';

  // ── Utilitários ───────────────────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function fmtV(v) { return 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fmtN(v) { return Number(v || 0).toLocaleString('pt-BR', { maximumFractionDigits: 3 }); }
  function fmtD(d) { if (!d) return '—'; const s = String(d).slice(0, 10); return s.slice(8,10) + '/' + s.slice(5,7) + '/' + s.slice(0,4); }
  function fmtDH(d) { if (!d) return '—'; try { return new Date(d).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }); } catch (e) { return '—'; } }
  function diasDesde(d) { if (!d) return ''; const n = Math.floor((Date.now() - new Date(d).getTime()) / 864e5); return n <= 0 ? 'hoje' : n === 1 ? 'há 1 dia' : 'há ' + n + ' dias'; }
  function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
  function barra(a, b) { const p = Math.min(100, pct(a, b)); return `<div class="barra" title="${p}%"><div style="width:${p}%"></div></div>`; }
  function num(v) { const n = parseFloat(String(v).replace(/\./g, '').replace(',', '.')); return isNaN(n) ? 0 : n; }
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('vis'); setTimeout(() => t.classList.remove('vis'), 2600); }
  function chamar(acao, params) {
    return new Promise(ok => google.script.run.withSuccessHandler(ok)
      .withFailureHandler(e => ok({ ok: false, erro: e.message })).chamarAcao(token, acao, JSON.stringify(params || {})));
  }
  const SIT_REQ = { aguardando_contratacao: 'Pendente: aguarda contratação', aguardando_gestor: 'Aguardando o gestor',

    empenhada: 'Empenhada', liquidada: 'Liquidada', paga: 'Paga', cancelada: 'Cancelada' };
  const FORMAS = { contrato: 'Contrato vigente', ata: 'Ata de registro de preços', nova_contratacao: 'Nova contratação',
    bolsas_editais: 'Bolsas e editais', diarias: 'Diárias', outros: 'Outros' };
  const TIPOS_INST = { contrato: 'Contrato', ata: 'Ata de RP', processo: 'Processo de contratação' };
  const SIT_INST = { vigente: 'Vigente', encerrado: 'Encerrado', em_andamento: 'Em andamento', concluido: 'Concluído', fracassado: 'Fracassado' };
  function stReq(s) { return `<span class="st st-${s}">${esc(SIT_REQ[s] || s)}</span>`; }
  function stInst(s) { return `<span class="st st-${s}">${esc(SIT_INST[s] || s)}</span>`; }
  function abrirModal(titulo, html, largo) {
    $('modal-titulo').innerHTML = titulo; $('modal-corpo').innerHTML = html;
    $('modal').classList.toggle('estreito', !largo);
    $('modal-erro').classList.remove('vis'); $('overlay').classList.add('aberto');
  }
  function fecharModal() { $('overlay').classList.remove('aberto'); }
  function erroModal(m) { const e = $('modal-erro'); e.textContent = m; e.classList.add('vis'); e.scrollIntoView({ block: 'nearest' }); }

  // ── Exercício e navegação ─────────────────────────────────────────────────
  function getExercicio() { return sessionStorage.getItem('pac_exercicio') || ''; }
  function trocarExercicio(ano) { sessionStorage.setItem('pac_exercicio', String(ano)); carregar(); }
  function popularSeletorExercicios(atualCfg) {
    const base = Number(atualCfg) || new Date().getFullYear();
    const atual = getExercicio() || base;
    const anos = PMO_ANOS();
    $('sel-exercicio').innerHTML = anos.map(a => `<option value="${a}" style="background:#3C3489;color:#fff"${String(a)===String(atual)?' selected':''}>${a}</option>`).join('');
    if (!getExercicio()) sessionStorage.setItem('pac_exercicio', String(base));
  }
  function navegar(page) { window.location.href = _pacUrlPagina(page); }
  function fazerLogout() { google.script.run.chamarAcao(token, 'logout', '{}'); try { localStorage.removeItem('pac_token'); } catch (e) {} navegar('login'); }

  (async function iniciar() {
    const r = await chamar('dados_usuario');
    if (!r.ok) { navegar('login'); return; }
    _usuario = r.usuario;
    $('av').textContent = _usuario.nome.charAt(0).toUpperCase();
    $('nome-usuario').textContent = _usuario.nome;
    $('unidade-usuario').textContent = _usuario.sigla || _usuario.unidade || '';
    const menus = PMO_MENUS[_usuario.papel] || [];
    $('sidebar').innerHTML = '<div class="nav-titulo" style="margin-top:8px">Menu</div>' + menus.map(m =>
      `<a class="nav-item${m.page===PAGINA_ATUAL?' ativo':''}" href="#" onclick="navegar('${m.page}');return false;"><svg viewBox="0 0 24 24">${PMO_ICONS[m.icon]||''}</svg> ${m.label}</a>`).join('');
    _ctx = await chamar('mon_contexto');
    if (!_ctx.ok) { $('conteudo').innerHTML = `<div class="vazio">${esc(_ctx.erro)}</div>`; return; }
    popularSeletorExercicios(_ctx.exercicio);
    iniciarPagina();
  })();
  const SIT_SOL = { elaboracao: 'Em elaboração', enviada: 'Enviada ao Orçamento', empenhada_parcial: 'Empenhada em parte',
    empenhada: 'Empenhada', devolvida: 'Devolvida pelo Orçamento', cancelada: 'Cancelada' };
  function stSol(s) { return `<span class="st st-sol-${s}">${esc(SIT_SOL[s] || s)}</span>`; }

  let _aba = 'painel', _filtroSit = '', _filtroReqSit = '';
  const pode = () => _ctx && _ctx.pode_editar;
  const SIT_DEM = { sem_requisicao: 'Sem requisição', requisitada: 'Requisitada', aprovada: 'Aprovada pelo gestor',
    empenhada: 'Empenhada', em_execucao: 'Em execução', liquidada: 'Liquidada', paga: 'Paga', encerrada: 'Não será requisitada' };
  const ESTADOS = { vencido: 'Prazo vencido', a_vencer: 'Vence em até 15 dias', no_prazo: 'No prazo', sem_prazo: 'Sem prazo', nao_aplica: '—' };
  const CANAIS = { sei: 'SEI', email: 'E-mail', telefone: 'Telefone', presencial: 'Presencial', outro: 'Outro' };
  function sitDem(d) { return `<span class="st dm-${d.situacao}">${esc(SIT_DEM[d.situacao] || d.situacao)}</span>`; }
  function semPrazo(d) {
    if (d.estado_prazo === 'nao_aplica') return '<span class="sem sem-nao_aplica">—</span>';
    if (d.estado_prazo === 'sem_prazo') return '<span class="sem sem-sem_prazo">sem prazo</span>';
    const extra = d.estado_prazo === 'vencido' ? ` · há ${-d.dias_prazo} d` : d.estado_prazo === 'a_vencer' ? ` · em ${d.dias_prazo} d` : '';
    return `<span class="sem sem-${d.estado_prazo}" title="${esc(ESTADOS[d.estado_prazo])} — ${d.prazo_origem === 'proprio' ? 'prazo próprio' : 'calendário: ' + esc(d.prazo_origem)}">${fmtD(d.prazo)}${extra}</span>`;
  }
  const soma = (l, k) => l.reduce((t, x) => t + Number(x[k] || 0), 0);

  function iniciarPagina() {
    if (!pode()) { document.body.classList.add('leitura'); $('selo-modo').style.display = ''; $('selo-modo').textContent = 'Somente consulta'; }
    if (_ctx.opcoes_escopo.length) {
      $('caixa-escopo').style.display = '';
      $('sel-escopo').innerHTML = _ctx.opcoes_escopo.map(o => `<option value="${o.valor}">${esc(o.nome)}</option>`).join('');
    }
    const abaUrl = new URLSearchParams(location.search).get('aba');
    if (abaUrl) _aba = abaUrl;
    carregar();
  }
  async function carregar() {
    $('exercicio-label').textContent = getExercicio();
    $('conteudo').innerHTML = '<div class="carregando">Carregando…</div>';
    const r = await chamar('mon_dados', { exercicio: getExercicio(), escopo: $('sel-escopo').value || 'todos' });
    if (!r.ok) { $('conteudo').innerHTML = `<div class="vazio">${esc(r.erro)}</div>`; return; }
    _dados = r;
    const n = r.resumo.vencidos;
    $('cnt-pend').style.display = n ? '' : 'none'; $('cnt-pend').textContent = n;
    mostrarAba(_aba);
  }
  function mostrarAba(aba) {
    _aba = aba;
    document.querySelectorAll('.aba').forEach(b => b.classList.toggle('ativa', b.dataset.aba === aba));
    if (!_dados) return;
    ({ painel: renderPainel, demandas: renderDemandas, requisicoes: renderRequisicoes, empenhos: renderEmpenhos,
       liquidacoes: renderLiquidacoes, pendencias: renderPendencias, calendario: renderCalendario, residuos: renderResiduos })[aba]();
  }

  // ── Painel ────────────────────────────────────────────────────────────────
  function renderPainel() {
    const s = _dados.resumo;
    const tab = (lista, rotulo) => lista.length ? `<table><thead><tr><th>${rotulo}</th><th class="num">Homologado</th><th class="num">Requisitado</th><th class="num">Empenhado</th><th class="num">Liquidado</th><th>Execução</th><th class="num">Vencidas</th></tr></thead><tbody>
      ${lista.map(x => `<tr><td>${esc(x.nome)}<span class="sub">${x.n} demanda(s)</span></td><td class="num">${fmtV(x.homologado)}</td><td class="num">${fmtV(x.requisitado)}</td>
        <td class="num">${fmtV(x.empenhado)}</td><td class="num">${fmtV(x.liquidado)}</td>
        <td style="min-width:130px"><div style="display:flex;align-items:center;gap:8px">${barra(x.liquidado, x.homologado)}<span style="font-size:11.5px;color:#888780">${pct(x.liquidado, x.homologado)}%</span></div></td>
        <td class="num">${x.vencidas ? `<span class="sem sem-vencido">${x.vencidas}</span>` : '—'}</td></tr>`).join('')}
      </tbody></table>` : '<div class="vazio">Nenhuma demanda homologada neste filtro.</div>';
    $('conteudo').innerHTML = `
      <div class="cadeia">
        <div class="elo"><span>Homologado</span><b>${fmtV(s.homologado)}</b><small>${s.n} demanda(s)</small></div>
        <div class="elo"><span>Requisitado</span><b>${fmtV(s.requisitado)}</b><small>${pct(s.requisitado, s.homologado)}% · saldo ${fmtV(s.saldo_requisitar)}</small></div>
        <div class="elo"><span>Aprovado (real)</span><b>${fmtV(s.aprovado)}</b><small>pelos gestores</small></div>
        <div class="elo"><span>Empenhado</span><b>${fmtV(s.empenhado)}</b><small>${pct(s.empenhado, s.homologado)}% do homologado</small></div>
        <div class="elo" style="background:#F4F3FE"><span>Liquidado (executado)</span><b>${fmtV(s.liquidado)}</b><small>${pct(s.liquidado, s.homologado)}% de execução</small></div>
        <div class="elo"><span>Pago</span><b>${fmtV(s.pago)}</b><small>${pct(s.pago, s.liquidado)}% do liquidado</small></div>
      </div>
      <div class="cards">
        <div class="card ${s.vencidos ? 'vermelho' : ''}"><div class="card-label">Prazo para requisitar vencido</div><div class="card-valor">${s.vencidos}</div><div class="card-det">a vencer em 15 dias: ${s.a_vencer}</div></div>
        <div class="card" style="cursor:pointer" onclick="mostrarAba('residuos')"><div class="card-label">Saldo a devolver à Reitoria</div><div class="card-valor">${fmtV(s.residuos)}</div><div class="card-det">${_dados.residuos.length} demanda(s) · já devolvido ${fmtV(s.devolvido)}</div></div>
        <div class="card ${Math.abs(_dados.conciliacao.total.sem_vinculo) > 0.005 ? 'vermelho' : ''}"><div class="card-label">Empenho sem vínculo</div><div class="card-valor">${fmtV(_dados.conciliacao.total.sem_vinculo)}</div><div class="card-det">deve ser zero</div></div>
        <div class="card"><div class="card-label">A empenhar</div><div class="card-valor">${fmtV(_dados.conciliacao.total.a_empenhar)}</div><div class="card-det">solicitado e ainda não empenhado</div></div>
      </div>
      <div class="secao"><div class="secao-header"><span class="secao-titulo">Situação das demandas</span></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;padding:14px 18px">
          ${Object.keys(SIT_DEM).map(k => `<button class="btn" onclick="_filtroSit='${k}';mostrarAba('demandas')"><span class="st dm-${k}">${SIT_DEM[k]}</span> <b style="margin-left:4px">${s.por_situacao[k] || 0}</b></button>`).join('')}
        </div></div>
      <div class="grade2">
        <div class="secao"><div class="secao-header"><span class="secao-titulo">Por unidade</span></div><div class="tabela-scroll">${tab(s.por_unidade, 'Unidade')}</div></div>
        <div class="secao"><div class="secao-header"><span class="secao-titulo">Por categoria de despesa</span></div><div class="tabela-scroll">${tab(s.por_categoria, 'Categoria')}</div></div>
      </div>`;
  }

  // ── Demandas ──────────────────────────────────────────────────────────────
  function renderDemandas() {
    const unidades = [...new Set(_dados.demandas.map(d => d.sigla_unidade))].sort();
    $('conteudo').innerHTML = `<div class="secao"><div class="secao-header"><span class="secao-titulo">Demandas homologadas</span>
      <div class="filtros">
        <select id="fd-sit" onchange="_filtroSit=this.value;filtrarDem()"><option value="">Todas as situações</option>${Object.keys(SIT_DEM).map(k => `<option value="${k}"${_filtroSit===k?' selected':''}>${SIT_DEM[k]}</option>`).join('')}</select>
        <select id="fd-un" onchange="filtrarDem()"><option value="">Todas as unidades</option>${unidades.map(u => `<option>${esc(u)}</option>`).join('')}</select>
        <select id="fd-prazo" onchange="filtrarDem()"><option value="">Qualquer prazo</option>${['vencido','a_vencer','no_prazo','sem_prazo'].map(k => `<option value="${k}">${ESTADOS[k]}</option>`).join('')}</select>
        <input id="fd-busca" placeholder="Código ou objeto" oninput="filtrarDem()">
      </div></div><div class="tabela-scroll" id="tab-dem"></div></div>`;
    filtrarDem();
  }
  function filtrarDem() {
    const sit = $('fd-sit').value, un = $('fd-un').value, pr = $('fd-prazo').value, b = $('fd-busca').value.toLowerCase();
    const L = _dados.demandas.filter(d => (!sit || d.situacao === sit) && (!un || d.sigla_unidade === un) && (!pr || d.estado_prazo === pr)
      && (!b || (d.codigo + ' ' + d.descricao_objeto).toLowerCase().includes(b)));
    $('tab-dem').innerHTML = L.length ? `<table><thead><tr><th>Demanda</th><th>Unidade</th><th class="num">Homologado</th><th class="num">A requisitar</th><th class="num">Requisitado</th><th class="num">Empenhado</th><th class="num">Liquidado</th><th>Execução</th><th>Prazo p/ requisitar</th><th>Situação</th></tr></thead><tbody>
      ${L.map(d => `<tr class="clicavel" onclick="abrirFicha('${d.id_demanda}')">
        <td><span class="cod-dem">${esc(d.codigo)}</span><span class="sub" style="max-width:260px">${esc(d.descricao_objeto)}</span></td>
        <td>${esc(d.sigla_unidade)}<span class="sub">${esc(d.categoria||'')}</span></td>
        <td class="num">${fmtV(d.valor_estimado)}</td><td class="num">${d.encerrada ? '—' : fmtV(d.saldo)}</td>
        <td class="num">${fmtV(d.requisitado)}<span class="sub">${d.n_requisicoes} req.</span></td>
        <td class="num">${fmtV(d.empenhado)}</td><td class="num">${fmtV(d.liquidado)}</td>
        <td style="min-width:110px"><div style="display:flex;align-items:center;gap:6px">${barra(d.liquidado, d.valor_estimado)}<span style="font-size:11px;color:#888780">${d.pct_execucao}%</span></div></td>
        <td>${semPrazo(d)}</td><td>${sitDem(d)}</td></tr>`).join('')}
      <tr><td colspan="2"><b>Total (${L.length})</b></td><td class="num"><b>${fmtV(soma(L,'valor_estimado'))}</b></td><td class="num"><b>${fmtV(soma(L.filter(d=>!d.encerrada),'saldo'))}</b></td>
        <td class="num"><b>${fmtV(soma(L,'requisitado'))}</b></td><td class="num"><b>${fmtV(soma(L,'empenhado'))}</b></td><td class="num"><b>${fmtV(soma(L,'liquidado'))}</b></td><td colspan="3"></td></tr>
      </tbody></table>` : '<div class="vazio">Nenhuma demanda neste filtro.</div>';
  }

      <div class="cadeia">
        <div class="elo"><span>Homologado</span><b>${fmtV(d.valor_estimado)}</b><small>${d.devolvido > 0.005 ? 'devolvido à Reitoria ' + fmtV(d.devolvido) : fmtN(d.quantidade) + ' ' + esc(d.unidade_medida||'')}</small></div>

      ${d.encerrada ? `<div class="aviso"><b>Não será requisitada</b> desde ${fmtD(d.data_encerramento)}: ${esc(d.motivo_encerramento)}</div>` : ''}

        <thead><tr><th>Requisição</th><th>Atendimento</th><th class="num">Requisitado</th><th class="num">Real</th><th>Solicitação</th><th>Empenhos</th><th>Liquidações</th><th>Situação</th></tr></thead><tbody>
        ${R.map(x => `<tr><td><span class="cod-req">${esc(x.codigo)}</span><span class="sub">${fmtD(x.data_criacao)}</span></td>

          <td>${x.empenhos.map(e => `${esc(e.numero)} <span class="sub" style="display:inline">${fmtV(e.valor)}</span>`).join('<br>') || '—'}</td>
          <td>${x.liquidacoes.map(l => `${esc(l.documento)} · ${fmtD(l.data)} <span class="sub" style="display:inline">${fmtV(l.valor)}</span>`).join('<br>') || '—'}</td>
          <td>${stReq(x.situacao)}${x.motivo && ['pendente','cancelada'].includes(x.situacao) ? `<span class="sub">${esc(x.motivo)}</span>` : ''}</td></tr>`).join('')
          || '<tr><td colspan="8" class="vazio" style="padding:14px">Nenhuma requisição ainda.</td></tr>'}
        </tbody></table></div></div>
      <div class="grade2">
        <div class="bloco"><div class="bloco-titulo">Prazo para requisitar</div>
          <div style="font-size:13px;margin-bottom:8px">${semPrazo(d)} ${d.prazo && d.estado_prazo !== 'nao_aplica' ? `<span class="sub">${d.prazo_origem === 'proprio' ? 'Prazo próprio desta demanda' + (d.prazo_motivo ? ': ' + esc(d.prazo_motivo) : '') : 'Do calendário (' + esc(d.prazo_origem) + ')'}</span>` : ''}</div>
          <div class="form so-editor"><div class="campo"><label>Prazo próprio</label><input type="date" id="fp-data" value="${r.prazo_proprio ? r.prazo_proprio.data_limite : ''}"></div>

            ? `<button class="btn btn-mini" onclick="encerrar('${d.id_demanda}', true)">Desfazer "não será requisitada"</button>`
            : d.saldo > 0.005 ? `<div class="campo"><label>Marcar o saldo (${fmtV(d.saldo)}) como "não será requisitado"</label><input id="fe-motivo" placeholder="Motivo"></div>
               <div class="rodape" style="margin-top:6px"><button class="btn btn-mini btn-r" onclick="encerrar('${d.id_demanda}', false)">Não será requisitada</button></div>` : ''}</div>

            ${c.resposta ? `<span class="sub" style="color:#085041">Resposta (${fmtD(c.data_resposta)}): ${esc(c.resposta)}</span>` : pode() ? `<button class="btn btn-mini" style="margin-top:4px" onclick="responder('${c.id_cobranca}','${d.id_demanda}')">Registrar resposta</button>` : ''}</div>`).join('') || '<div>Nenhuma cobrança.</div>'}</div>
          <div class="form so-editor" style="margin-top:10px">
            <div class="campo"><label>Canal</label><select id="fc-canal">${Object.keys(CANAIS).map(k => `<option value="${k}">${CANAIS[k]}</option>`).join('')}</select></div>
            <div class="campo largo"><label>Registro</label><textarea id="fc-reg" rows="2" placeholder="Ex.: Ofício SEI nº … cobrando a requisição do saldo"></textarea></div></div>
          <div class="rodape so-editor" style="margin-top:6px"><button class="btn btn-mini" onclick="cobrar('${d.id_demanda}')">Registrar cobrança</button></div>
        </div>
      </div>
      <div class="bloco"><div class="bloco-titulo">Devolução de saldo à Reitoria</div>
        <div style="font-size:12.5px;color:#5F5E5A;margin-bottom:8px">Pode ser devolvido: <b>${fmtV(d.devolvivel)}</b> — o homologado menos o já devolvido e o que as requisições comprometem (valor real, se aprovadas).</div>
        ${listaDevolucoes(r.devolucoes, d.id_demanda)}
        ${d.devolvivel > 0.005 ? `<div class="form so-editor" style="margin-top:10px">
          <div class="campo"><label>Valor (R$)</label><input type="number" id="fd-valor" min="0.01" step="0.01" max="${d.devolvivel.toFixed(2)}" value="${sugestaoDevolucao(d).valor.toFixed(2)}"></div>
          <div class="campo"><label>Motivo</label><select id="fd-motivo">${Object.entries(r.motivos_devolucao).map(([k, n]) => `<option value="${k}"${k === sugestaoDevolucao(d).motivo ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select></div>
          <div class="campo largo"><label>Observação</label><input id="fd-obs" placeholder="Ex.: economia na ata nº …; prazo encerrado em …"></div></div>
          <div class="rodape so-editor" style="margin-top:6px"><button class="btn btn-mini btn-p" onclick="devolver('${d.id_demanda}', true)">Devolver à Reitoria</button></div>` : ''}
      </div>
      <div class="rodape"><button class="btn" onclick="fecharModal()">Fechar</button></div>`;
  }

  // ── Devolução de saldo à Reitoria ─────────────────────────────────────────
  function sugestaoDevolucao(d) {
    const economia = Math.max(0, d.residuo - d.devolvido);
    if (d.encerrada) return { motivo: 'nao_requisitada', valor: d.devolvivel };
    if (d.estado_prazo === 'vencido') return { motivo: 'prazo_encerrado', valor: d.devolvivel };
    if (economia > 0.005) return { motivo: 'economia', valor: Math.min(economia, d.devolvivel) };
    return { motivo: 'outro', valor: d.devolvivel };
  }
  function listaDevolucoes(L, idDem) {
    if (!L || !L.length) return '<div class="caixa hist"><div>Nenhuma devolução.</div></div>';
    return `<div class="caixa hist">${L.map(v => `<div${v.desfeita_em ? ' style="opacity:.6"' : ''}><b>${fmtV(v.valor)}</b> · ${esc(v.motivo_nome)} · ${fmtDH(v.data_criacao)} · ${esc(v.autor||'')}
      ${v.observacao ? `<span class="sub">${esc(v.observacao)}</span>` : ''}
      ${v.desfeita_em ? `<span class="sub" style="color:#791F1F">Desfeita em ${fmtDH(v.desfeita_em)} por ${esc(v.autor_desfez||'')}: ${esc(v.motivo_desfazer||'')}</span>`
        : `<button class="btn btn-mini so-editor" style="margin-top:4px" onclick="desfazerDevolucao('${v.id_devolucao}', '${idDem||''}')">Desfazer</button>`}</div>`).join('')}</div>`;
  }
  async function devolver(id, daFicha) {
    const valor = Number($('fd-valor').value);
    const motivo = $('fd-motivo').value, obs = $('fd-obs').value.trim();
    if (!(valor > 0)) return erroModal('Informe o valor a devolver.');
    if (motivo === 'outro' && obs.length < 5) return erroModal('Descreva o motivo na observação.');
    if (!confirm('Devolver ' + fmtV(valor) + ' à Reitoria? O valor sai da demanda e da cadeia de repasses e volta como saldo livre da Reitoria. Dá para desfazer enquanto a Reitoria não redistribuir.')) return;
    const r = await chamar('dev_devolver', { id_demanda: id, valor, motivo, observacao: obs });
    if (!r.ok) return erroModal(r.erro);
    toast('Saldo devolvido à Reitoria.'); await carregar();
    if (daFicha) abrirFicha(id); else fecharModal();
  }
  function formDevolucao(id) {
    const d = _dados.demandas.find(x => x.id_demanda === id);
    if (!d) return;
    const sug = sugestaoDevolucao(d);
    abrirModal(`Devolver saldo — <span class="cod-dem">${esc(d.codigo)}</span>`, `
      <div style="font-size:13px;margin-bottom:10px">${esc(d.descricao_objeto)}<span class="sub">${esc(d.sigla_unidade)} · homologado ${fmtV(d.valor_estimado)} · pode ser devolvido ${fmtV(d.devolvivel)}</span></div>
      <div class="form">
        <div class="campo"><label>Valor (R$)</label><input type="number" id="fd-valor" min="0.01" step="0.01" max="${d.devolvivel.toFixed(2)}" value="${sug.valor.toFixed(2)}"></div>
        <div class="campo"><label>Motivo</label><select id="fd-motivo">${Object.entries(_dados.motivos_devolucao).map(([k, n]) => `<option value="${k}"${k === sug.motivo ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select></div>
        <div class="campo largo"><label>Observação</label><input id="fd-obs" placeholder="Ex.: economia na ata nº …; prazo encerrado em …"></div>
      </div>
      <div class="rodape"><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn btn-p" onclick="devolver('${id}', false)">Devolver à Reitoria</button></div>`);
  }
  async function desfazerDevolucao(idDev, idDem) {
    const motivo = prompt('Por que a devolução será desfeita?');
    if (motivo === null) return;
    if (motivo.trim().length < 5) { toast('Escreva o motivo (mínimo 5 caracteres).'); return; }
    const r = await chamar('dev_desfazer', { id_devolucao: idDev, motivo: motivo.trim() });
    if (!r.ok) { if (idDem) return erroModal(r.erro); toast(r.erro); return; }
    toast('Devolução desfeita: o valor voltou para a demanda.'); await carregar();
    if (idDem) abrirFicha(idDem);
  }

  async function salvarPrazoDem(id, limpar) {
    const r = await chamar('mon_prazo_demanda', { id_demanda: id, data_limite: limpar ? '' : $('fp-data').value, motivo: $('fp-motivo').value });
    if (!r.ok) return erroModal(r.erro);
    toast('Prazo atualizado.'); await carregar(); abrirFicha(id);
  }
  async function encerrar(id, desfazer) {
    const motivo = desfazer ? '' : $('fe-motivo').value.trim();
    if (!desfazer && motivo.length < 5) return erroModal('Escreva o motivo.');
    const r = await chamar('mon_encerrar', { id_demanda: id, motivo });
    if (!r.ok) return erroModal(r.erro);
    toast(desfazer ? 'Demanda voltou às pendências.' : 'Saldo marcado como não requisitado.'); await carregar(); abrirFicha(id);
  }
  async function cobrar(id) {
    const r = await chamar('mon_cobrar', { id_demanda: id, canal: $('fc-canal').value, registro: $('fc-reg').value });
    if (!r.ok) return erroModal(r.erro);
    toast('Cobrança registrada.'); await carregar(); abrirFicha(id);
  }
  async function responder(idCob, idDem) {
    const resp = prompt('Resposta da unidade:');
    if (!resp) return;
    const r = await chamar('mon_resposta_cobranca', { id_cobranca: idCob, resposta: resp });
    if (!r.ok) return erroModal(r.erro);
    abrirFicha(idDem);
  }

  // ── Requisições ───────────────────────────────────────────────────────────
  function renderRequisicoes() {
    const R = _dados.requisicoes;
    const un = [...new Set(R.map(x => x.sigla_unidade))].sort(), gest = [...new Set(R.map(x => x.sigla_gestora))].sort();
    const inst = [...new Set(R.filter(x => x.numero_instrumento).map(x => x.numero_instrumento))].sort();
    $('conteudo').innerHTML = `<div class="secao"><div class="secao-header"><span class="secao-titulo">Requisições</span>
      <div class="filtros">
        <select id="fr-sit" onchange="_filtroReqSit=this.value;filtrarReq()"><option value="">Todas as situações</option>${Object.keys(SIT_REQ).filter(k => k !== 'cancelada').map(k => `<option value="${k}"${_filtroReqSit===k?' selected':''}>${SIT_REQ[k]}</option>`).join('')}</select>
        <select id="fr-un" onchange="filtrarReq()"><option value="">Unidade requerente</option>${un.map(u => `<option>${esc(u)}</option>`).join('')}</select>
        <select id="fr-gest" onchange="filtrarReq()"><option value="">Seção gestora</option>${gest.map(u => `<option>${esc(u)}</option>`).join('')}</select>
        <select id="fr-inst" onchange="filtrarReq()"><option value="">Instrumento</option>${inst.map(u => `<option>${esc(u)}</option>`).join('')}</select>
      </div></div><div class="tabela-scroll" id="tab-req"></div></div>`;
    filtrarReq();
  }
  function filtrarReq() {
    const sit = $('fr-sit').value, un = $('fr-un').value, g = $('fr-gest').value, i = $('fr-inst').value;
    const L = _dados.requisicoes.filter(x => (!sit || x.situacao === sit) && (!un || x.sigla_unidade === un) && (!g || x.sigla_gestora === g) && (!i || x.numero_instrumento === i))
      .sort((a, b) => b.dias_situacao - a.dias_situacao);
    $('tab-req').innerHTML = L.length ? `<table><thead><tr><th>Requisição</th><th>Unidade</th><th>Atendimento</th><th class="num">Requisitado</th><th class="num">Real</th><th class="num">Empenhado</th><th class="num">Liquidado</th><th>Situação</th><th class="num">Dias na situação</th></tr></thead><tbody>
      ${L.map(x => `<tr class="clicavel" onclick="abrirFicha('${x.id_demanda}')">
        <td><span class="cod-req">${esc(x.codigo)}</span><span class="sub">${esc(x.codigo_demanda)}</span></td>
        <td>${esc(x.sigla_unidade)}</td>
        <td>${esc(FORMAS[x.forma]||x.forma)}<span class="sub">${esc(x.numero_instrumento||'')} · gestão ${esc(x.sigla_gestora)}</span></td>
        <td class="num">${fmtV(x.valor)}</td><td class="num">${x.valor_real ? fmtV(x.valor_real) : '—'}</td>
        <td class="num">${fmtV(x.empenhado)}</td><td class="num">${fmtV(x.liquidado)}</td>
        <td>${stReq(x.situacao)}${x.codigo_solicitacao ? `<span class="sub">${esc(x.codigo_solicitacao)}</span>` : ''}</td>
        <td class="num">${x.dias_situacao > 30 && !['liquidada','paga'].includes(x.situacao) ? `<b style="color:#A32D2D">${x.dias_situacao}</b>` : x.dias_situacao}</td></tr>`).join('')}
      </tbody></table>` : '<div class="vazio">Nenhuma requisição neste filtro.</div>';
  }

  // ── Empenhos (só leitura) ─────────────────────────────────────────────────
  function renderEmpenhos() {
    const E = _dados.empenhos;
    $('conteudo').innerHTML = `<div class="secao"><div class="secao-header"><span class="secao-titulo">Empenhos registrados pela Seção de Orçamento</span><span class="selo">só leitura</span></div>
      <div class="tabela-scroll">${E.length ? `<table><thead><tr><th>Empenho</th><th>Ação / natureza</th><th>Fonte</th><th>Favorecido</th><th class="num">Valor atual</th><th class="num">Coberto</th><th class="num">Sem vínculo</th><th>Solicitações</th></tr></thead><tbody>
        ${E.map(e => `<tr><td><b>${esc(e.numero)}</b><span class="sub">${fmtD(e.data_emissao)}</span></td>
          <td>${esc(e.acao_governo||'—')}<span class="sub">${esc(e.natureza_despesa||'')}</span></td><td>${esc(e.fonte_codigo||'—')}</td>
          <td>${esc(e.favorecido_nome||'—')}</td><td class="num">${fmtV(e.valor_atual)}</td><td class="num">${fmtV(e.coberto)}</td>
          <td class="num">${Math.abs(e.sem_vinculo) > 0.005 ? `<span class="alerta-num">${fmtV(e.sem_vinculo)}</span>` : '—'}</td><td>${esc(e.solicitacoes||'—')}</td></tr>`).join('')}
        </tbody></table>` : '<div class="vazio">Nenhum empenho neste filtro.</div>'}</div></div>
      <h3 style="font-size:15px;margin:22px 0 12px">Conciliação pedido × empenho</h3>
      ${htmlConciliacao(_dados.conciliacao)}`;
  }

  // ── Liquidações e pagamentos ──────────────────────────────────────────────
  function renderLiquidacoes() {
    const L = _dados.liquidacoes;
    const aLiquidar = _dados.requisicoes.filter(x => x.empenhado - x.liquidado > 0.005);
    $('conteudo').innerHTML = `
      <div class="cards">
        <div class="card"><div class="card-label">Empenhado a liquidar</div><div class="card-valor">${fmtV(aLiquidar.reduce((t, x) => t + x.empenhado - x.liquidado, 0))}</div><div class="card-det">${aLiquidar.length} requisição(ões)</div></div>
        <div class="card"><div class="card-label">Liquidado</div><div class="card-valor">${fmtV(soma(L, 'valor'))}</div><div class="card-det">${L.length} liquidação(ões)</div></div>
        <div class="card"><div class="card-label">Pago</div><div class="card-valor">${fmtV(soma(L, 'pago'))}</div><div class="card-det">a pagar ${fmtV(soma(L, 'a_pagar'))}</div></div>
      </div>
      <div class="secao"><div class="secao-header"><span class="secao-titulo">Liquidações</span>
        <button class="btn btn-p btn-mini so-editor" onclick="formLiquidacao(null)">+ Lançar liquidação</button></div>
      <div class="tabela-scroll">${L.length ? `<table><thead><tr><th>Documento</th><th>Data</th><th>Requisições</th><th class="num">Valor</th><th class="num">Sem vínculo</th><th class="num">Pago</th><th class="num">A pagar</th></tr></thead><tbody>
        ${L.map(l => `<tr class="clicavel" onclick="verLiquidacao('${l.id_liquidacao}')"><td><b>${esc(l.documento)}</b>${l.observacao ? `<span class="sub">${esc(l.observacao)}</span>` : ''}</td>
          <td>${fmtD(l.data)}</td><td style="max-width:260px">${esc(l.requisicoes||'—')}</td><td class="num">${fmtV(l.valor)}</td>
          <td class="num">${Math.abs(l.sem_vinculo) > 0.005 ? `<span class="alerta-num">${fmtV(l.sem_vinculo)}</span>` : '—'}</td>
          <td class="num">${fmtV(l.pago)}${l.ultimo_pagamento ? `<span class="sub">${fmtD(l.ultimo_pagamento)}</span>` : ''}</td>
          <td class="num">${l.a_pagar > 0.005 ? `<b>${fmtV(l.a_pagar)}</b>` : '—'}</td></tr>`).join('')}
        </tbody></table>` : '<div class="vazio">Nenhuma liquidação lançada neste filtro.</div>'}</div></div>`;
  }
  async function formLiquidacao(id) {
    let l = {}, itens = [];
    if (id) { const r = await chamar('liq_detalhe', { id_liquidacao: id }); if (!r.ok) return toast(r.erro); l = r.liquidacao; itens = r.itens; }
    const R = _dados.requisicoes;
    const daqui = i => (itens.find(x => x.id_requisicao === i.id_requisicao) || {}).valor || 0;
    const cand = R.filter(x => x.empenhado - x.liquidado + daqui(x) > 0.005);
    window._liq = cand.map(x => { const v = daqui(x); return { x, max: x.empenhado - x.liquidado + v, valor: v || (x.empenhado - x.liquidado), marcado: !!v }; });
    abrirModal(id ? `Editar liquidação ${esc(l.documento)}` : 'Lançar liquidação', `
      <div class="form">
        <div class="campo"><label>Nota fiscal ou documento *</label><input id="l-doc" value="${esc(l.documento||'')}" placeholder="NF 1234"></div>
        <div class="campo"><label>Data da liquidação *</label><input type="date" id="l-data" value="${l.data || new Date().toISOString().slice(0,10)}"></div>
        <div class="campo"><label>Valor liquidado (R$) *</label><input type="number" step="0.01" min="0" id="l-valor" value="${l.valor || ''}" oninput="somarLiq()"></div>
        <div class="campo largo"><label>Observação</label><input id="l-obs" value="${esc(l.observacao||'')}"></div>
      </div>
      <div class="bloco" style="margin-top:16px"><div class="bloco-titulo">Requisições que esta liquidação cobre <input id="l-busca" class="btn" style="margin-left:auto;text-align:left" placeholder="Filtrar…" oninput="desenharLiq()"></div>
        <div class="caixa tabela-scroll" style="max-height:340px;overflow-y:auto"><table><thead><tr><th></th><th>Requisição</th><th>Unidade</th><th>Instrumento</th><th class="num">Empenhado</th><th class="num">A liquidar</th><th class="num">Valor</th></tr></thead>
          <tbody id="liq-corpo"></tbody></table></div><div id="liq-soma" style="margin-top:8px"></div></div>
      <div class="rodape"><button class="btn" onclick="fecharModal()">Cancelar</button>
        <button class="btn btn-p" onclick="salvarLiquidacao('${id || ''}')">Salvar liquidação</button></div>`, true);
    desenharLiq();
  }
  function desenharLiq() {
    const b = ($('l-busca').value || '').toLowerCase();
    $('liq-corpo').innerHTML = window._liq.map((l, i) => ({ l, i })).filter(({ l }) => l.marcado || !b ||
      [l.x.codigo, l.x.codigo_demanda, l.x.sigla_unidade, l.x.numero_instrumento, l.x.descricao_objeto].some(v => String(v||'').toLowerCase().includes(b)))
      .map(({ l, i }) => `<tr class="cob-linha"><td><input type="checkbox" ${l.marcado ? 'checked' : ''} onchange="window._liq[${i}].marcado=this.checked;somarLiq()"></td>
        <td><span class="cod-req">${esc(l.x.codigo)}</span><span class="sub">${esc(l.x.descricao_objeto)}</span></td><td>${esc(l.x.sigla_unidade)}</td>
        <td>${esc(l.x.numero_instrumento || FORMAS[l.x.forma] || '')}<span class="sub">${esc(l.x.fornecedor_nome||'')}</span></td>
        <td class="num">${fmtV(l.x.empenhado)}</td><td class="num">${fmtV(l.max)}</td>
        <td class="num"><input type="number" step="0.01" min="0" value="${Number(l.valor).toFixed(2)}" oninput="window._liq[${i}].valor=Number(this.value||0);somarLiq()"></td></tr>`).join('')
      || '<tr><td colspan="7" class="vazio" style="padding:14px">Nenhuma requisição empenhada com saldo a liquidar.</td></tr>';
    somarLiq();
  }
  function somarLiq() {
    const m = window._liq.filter(l => l.marcado);
    const tot = m.reduce((t, l) => t + Number(l.valor || 0), 0), v = Number($('l-valor').value || 0);
    const acima = m.find(l => l.valor > l.max + 0.004);
    $('liq-soma').innerHTML = !m.length ? '<div class="info">Marque as requisições que esta nota cobre.</div>'
      : acima ? `<div class="bad-box">${esc(acima.x.codigo)}: o valor passa do que falta liquidar (${fmtV(acima.max)}).</div>`
      : Math.abs(v - tot) < 0.005 ? `<div class="ok-box">A liquidação cobre ${fmtV(tot)} em ${m.length} requisição(ões).</div>`
      : v > tot ? `<div class="bad-box">Faltam ${fmtV(v - tot)} para distribuir entre as requisições.</div>`
      : `<div class="bad-box">As requisições somam ${fmtV(tot)}, acima do valor da liquidação.</div>`;
  }
  async function salvarLiquidacao(id) {
    const itens = window._liq.filter(l => l.marcado && l.valor > 0).map(l => ({ id_requisicao: l.x.id_requisicao, valor: l.valor }));
    const r = await chamar('liq_salvar', { liquidacao: { id_liquidacao: id || null, documento: $('l-doc').value.trim(), data: $('l-data').value,
      valor: $('l-valor').value, observacao: $('l-obs').value, itens } });
    if (!r.ok) return erroModal(r.erro);
    fecharModal(); toast('Liquidação salva.'); await carregar(); verLiquidacao(r.id_liquidacao);
  }
  async function verLiquidacao(id) {
    abrirModal('Liquidação', '<div class="carregando">Carregando…</div>', true);
    const r = await chamar('liq_detalhe', { id_liquidacao: id });
    if (!r.ok) return erroModal(r.erro);
    const l = r.liquidacao;
    const reqPor = idr => _dados.requisicoes.find(x => x.id_requisicao === idr) || {};
    $('modal-titulo').innerHTML = `Liquidação <b>${esc(l.documento)}</b> · ${fmtD(l.data)}`;
    $('modal-corpo').innerHTML = `
      <div class="mini-cards"><div class="mini"><span>Valor</span><b>${fmtV(l.valor)}</b></div><div class="mini"><span>Coberto</span><b>${fmtV(l.coberto)}</b></div>
        <div class="mini"><span>Pago</span><b>${fmtV(l.pago)}</b></div><div class="mini"><span>A pagar</span><b>${fmtV(l.a_pagar)}</b></div></div>
      ${l.observacao ? `<div style="font-size:13px;margin-bottom:12px">${esc(l.observacao)}</div>` : ''}
      <div class="bloco"><div class="bloco-titulo">Requisições</div><div class="caixa tabela-scroll"><table><thead><tr><th>Requisição</th><th>Unidade</th><th>Objeto</th><th class="num">Valor</th></tr></thead><tbody>
        ${r.itens.map(i => { const x = reqPor(i.id_requisicao); return `<tr><td><span class="cod-req">${esc(x.codigo||'')}</span><span class="sub">${esc(x.codigo_demanda||'')}</span></td><td>${esc(x.sigla_unidade||'')}</td><td>${esc(x.descricao_objeto||'')}</td><td class="num">${fmtV(i.valor)}</td></tr>`; }).join('')}
      </tbody></table></div></div>
      <div class="bloco"><div class="bloco-titulo">Pagamentos</div><div class="caixa hist">
        ${r.pagamentos.map(p => `<div><b>${fmtV(p.valor)}</b> · ${fmtD(p.data)}${p.ordem_bancaria ? ' · OB ' + esc(p.ordem_bancaria) : ''}${p.observacao ? `<span class="sub">${esc(p.observacao)}</span>` : ''}
          <button class="btn btn-mini btn-r so-editor" style="float:right" onclick="excluirPag('${p.id_pagamento}','${l.id_liquidacao}')">Excluir</button></div>`).join('') || '<div>Nenhum pagamento lançado.</div>'}</div>
        <div class="form so-editor" style="margin-top:10px">
          <div class="campo"><label>Data do pagamento</label><input type="date" id="p-data" value="${new Date().toISOString().slice(0,10)}"></div>
          <div class="campo"><label>Valor (R$)</label><input type="number" step="0.01" min="0" id="p-valor" value="${l.a_pagar > 0 ? l.a_pagar.toFixed(2) : ''}"></div>
          <div class="campo"><label>Ordem bancária</label><input id="p-ob" placeholder="2026OB000123"></div>
          <div class="campo" style="justify-content:flex-end"><button class="btn" onclick="lancarPag('${l.id_liquidacao}')">Lançar pagamento</button></div></div></div>
      <div class="rodape"><button class="btn btn-r so-editor" style="margin-right:auto" onclick="excluirLiq('${l.id_liquidacao}')">Excluir liquidação</button>
        <button class="btn" onclick="fecharModal()">Fechar</button>
        <button class="btn btn-p so-editor" onclick="formLiquidacao('${l.id_liquidacao}')">Editar</button></div>`;
  }
  async function lancarPag(id) {
    const r = await chamar('pag_salvar', { pagamento: { id_liquidacao: id, data: $('p-data').value, valor: $('p-valor').value, ordem_bancaria: $('p-ob').value } });
    if (!r.ok) return erroModal(r.erro);
    toast('Pagamento lançado.'); await carregar(); verLiquidacao(id);
  }
  async function excluirPag(idPag, id) {
    const r = await chamar('pag_excluir', { id_pagamento: idPag });
    if (!r.ok) return erroModal(r.erro);
    await carregar(); verLiquidacao(id);
  }
  async function excluirLiq(id) {
    if (!confirm('Excluir esta liquidação?')) return;
    const r = await chamar('liq_excluir', { id_liquidacao: id });
    if (!r.ok) return erroModal(r.erro);
    fecharModal(); toast('Liquidação excluída.'); carregar();
  }

  // ── Pendências ────────────────────────────────────────────────────────────
  function renderPendencias() {
    const P = _dados.pendencias;
    $('conteudo').innerHTML = `<div class="secao"><div class="secao-header"><span class="secao-titulo">Demandas com saldo a requisitar e prazo vencido ou a vencer em 15 dias</span></div>
      <div class="tabela-scroll">${P.length ? `<table><thead><tr><th>Demanda</th><th>Unidade</th><th class="num">Saldo a requisitar</th><th>Prazo</th><th>Cobranças</th><th></th></tr></thead><tbody>
        ${P.map(d => `<tr><td><span class="cod-dem">${esc(d.codigo)}</span><span class="sub">${esc(d.descricao_objeto)}</span></td>
          <td>${esc(d.sigla_unidade)}</td><td class="num">${fmtV(d.saldo)}</td><td>${semPrazo(d)}</td>
          <td>${d.n_cobrancas ? `${d.n_cobrancas}<span class="sub">última ${fmtD(d.ultima_cobranca)}</span>` : '—'}</td>
          <td style="text-align:right"><button class="btn btn-mini" onclick="abrirFicha('${d.id_demanda}')">${pode() ? 'Cobrar / ficha' : 'Ficha'}</button></td></tr>`).join('')}
        </tbody></table>` : '<div class="vazio">Nenhuma pendência: todas as demandas com saldo estão no prazo ou sem prazo definido.</div>'}</div></div>
      <div class="info">O prazo de cada demanda vem do calendário (por unidade e, se houver, por categoria) ou de um prazo próprio definido na ficha. Demandas marcadas como "não será requisitada" saem desta lista.</div>`;
  }

  // ── Calendário de prazos para requisitar ──────────────────────────────────
  function opcoesEscopo() {
    const U = _ctx.unidades, raiz = _ctx.raiz;
    const meu = _ctx.unidade ? _ctx.unidade.id : null;
    const sub = new Set(); if (meu) { const f = [meu]; while (f.length) { const x = f.shift(); if (sub.has(x)) continue; sub.add(x); U.filter(u => u.pai === x).forEach(u => f.push(u.id)); } }
    const lista = U.filter(u => raiz || sub.has(u.id)).filter(u => ['reitoria','pro_reitoria','campus','diretoria_adm','diretoria_ped','coordenacao'].includes(u.tipo) || u.id === meu)
      .sort((a, b) => String(a.sigla||a.nome).localeCompare(String(b.sigla||b.nome)));
    return (raiz ? '<option value="">Toda a instituição</option>' : '') + lista.map(u => `<option value="${u.id}">${esc(u.sigla||'')} — ${esc(u.nome)}</option>`).join('');
  }
  function renderCalendario() {
    const C = _dados.calendario;
    $('conteudo').innerHTML = `<div class="secao"><div class="secao-header"><span class="secao-titulo">Prazos para requisitar — exercício ${_dados.exercicio}</span></div>
      <div class="tabela-scroll">${C.length ? `<table><thead><tr><th>Data limite</th><th>Escopo</th><th>Categoria</th><th>Descrição</th><th class="num">Demandas</th><th></th></tr></thead><tbody>
        ${C.map(m => `<tr><td><b>${fmtD(m.data_limite)}</b></td><td>${esc(m.escopo_nome)}</td><td>${esc(m.categoria_nome)}</td><td>${esc(m.descricao||'')}</td><td class="num">${m.n_demandas}</td>
          <td style="text-align:right">${m.editavel ? `<button class="btn btn-mini btn-r" onclick="excluirPrazo('${m.id_prazo}')">Excluir</button>` : ''}</td></tr>`).join('')}
        </tbody></table>` : '<div class="vazio">Nenhum prazo definido para este exercício.</div>'}</div></div>
      <div class="secao so-editor"><div class="secao-header"><span class="secao-titulo">Novo prazo</span></div><div style="padding:14px 18px">
        <div class="form">
          <div class="campo"><label>Escopo</label><select id="c-escopo">${opcoesEscopo()}</select></div>
          <div class="campo"><label>Categoria de despesa</label><select id="c-cat"><option value="">Todas as categorias</option>${(_ctx.categorias||[]).map(c => `<option value="${c.id_categoria}">${esc(c.nome)}</option>`).join('')}</select></div>
          <div class="campo"><label>Data limite para requisitar</label><input type="date" id="c-data"></div>
          <div class="campo"><label>Descrição</label><input id="c-desc" placeholder="Ex.: material de consumo"></div>
        </div>
        <div class="rodape"><button class="btn btn-p" onclick="salvarPrazo()">Salvar prazo</button></div>
        <div class="info" style="margin-top:10px">Vale o prazo mais específico: o próprio da demanda; depois o da unidade mais próxima na estrutura (com categoria antes do geral); por fim o de toda a instituição.</div>
      </div></div>`;
  }
  async function salvarPrazo() {
    const r = await chamar('mon_salvar_prazo', { prazo: { exercicio: _dados.exercicio, id_unidade_escopo: $('c-escopo').value,
      id_categoria: $('c-cat').value, data_limite: $('c-data').value, descricao: $('c-desc').value } });
    if (!r.ok) return toast(r.erro);
    toast('Prazo salvo.'); carregar();
  }
  async function excluirPrazo(id) {
    if (!confirm('Excluir este prazo?')) return;
    const r = await chamar('mon_excluir_prazo', { id_prazo: id });
    if (!r.ok) return toast(r.erro);
    carregar();
  }

  // ── Devolução de saldo à Reitoria ─────────────────────────────────────────
  function renderResiduos() {
    const X = _dados.residuos, V = _dados.devolucoes || [];
    const ativas = V.filter(v => !v.desfeita_em);
    const agrupa = (L, k) => { const g = {}; L.forEach(x => { const c = x[k] || '—'; g[c] = (g[c] || 0) + x.valor; }); return Object.entries(g).sort((a, b) => b[1] - a[1]); };
    const mini = (titulo, l) => `<div class="secao"><div class="secao-header"><span class="secao-titulo">${titulo}</span></div><table><tbody>
      ${l.map(([n, v]) => `<tr><td>${esc(n)}</td><td class="num">${fmtV(v)}</td></tr>`).join('') || '<tr><td class="vazio">—</td></tr>'}</tbody></table></div>`;
    $('conteudo').innerHTML = `
      <div class="info" style="margin-bottom:18px">Saldo que pode voltar à Reitoria: a economia na contratação (requisitado − valor real), o saldo das demandas marcadas como "não será requisitada" e o das demandas com prazo para requisitar vencido. A devolução é feita pelo Monitoramento: o valor sai da demanda e da cadeia de repasses e volta como saldo livre da Reitoria. Pode ser desfeita enquanto a Reitoria não redistribuir o valor.</div>
      <div class="cards">
        <div class="card"><div class="card-label">Saldo a devolver</div><div class="card-valor">${fmtV(X.reduce((t, x) => t + x.valor, 0))}</div><div class="card-det">${X.length} demanda(s)</div></div>
        <div class="card"><div class="card-label">Já devolvido à Reitoria</div><div class="card-valor">${fmtV(ativas.reduce((t, v) => t + v.valor, 0))}</div><div class="card-det">${ativas.length} devolução(ões)</div></div>
      </div>
      <div class="secao"><div class="secao-header"><span class="secao-titulo">A devolver</span></div><div class="tabela-scroll">${X.length ? `<table><thead><tr><th>Demanda</th><th>Unidade</th><th>Motivo sugerido</th><th class="num">Valor sugerido</th><th class="num">Pode ser devolvido</th><th></th></tr></thead><tbody>
        ${X.map(x => `<tr><td class="clicavel" onclick="abrirFicha('${x.id_demanda}')"><span class="cod-dem">${esc(x.codigo_demanda)}</span><span class="sub">${esc(x.descricao_objeto)}</span></td>
          <td>${esc(x.sigla_unidade)}</td><td>${esc(x.motivo_nome)}${x.detalhe ? `<span class="sub">${esc(x.detalhe)}</span>` : ''}</td>
          <td class="num"><b>${fmtV(x.valor)}</b></td><td class="num">${fmtV(x.devolvivel)}</td>
          <td><button class="btn btn-mini btn-p so-editor" onclick="formDevolucao('${x.id_demanda}')">Devolver</button></td></tr>`).join('')}
        </tbody></table>` : '<div class="vazio">Nenhum saldo a devolver neste filtro.</div>'}</div></div>
      <div class="grade2">${mini('Devolvido por unidade', agrupa(ativas, 'sigla_unidade'))}${mini('Devolvido por motivo', agrupa(ativas, 'motivo_nome'))}</div>
      <div class="secao"><div class="secao-header"><span class="secao-titulo">Devoluções registradas</span></div><div class="tabela-scroll">${V.length ? `<table><thead><tr><th>Data</th><th>Demanda</th><th>Unidade</th><th>Motivo</th><th class="num">Valor</th><th>Situação</th><th></th></tr></thead><tbody>
        ${V.map(v => `<tr${v.desfeita_em ? ' style="opacity:.6"' : ''}><td>${fmtDH(v.data_criacao)}<span class="sub">${esc(v.autor||'')}</span></td>
          <td class="clicavel" onclick="abrirFicha('${v.id_demanda}')"><span class="cod-dem">${esc(v.codigo_demanda)}</span><span class="sub">${esc(v.descricao_objeto)}</span></td>
          <td>${esc(v.sigla_unidade)}</td><td>${esc(v.motivo_nome)}${v.observacao ? `<span class="sub">${esc(v.observacao)}</span>` : ''}</td><td class="num"><b>${fmtV(v.valor)}</b></td>
          <td>${v.desfeita_em ? `Desfeita<span class="sub">${fmtDH(v.desfeita_em)} · ${esc(v.motivo_desfazer||'')}</span>` : 'Devolvida'}</td>
          <td>${v.desfeita_em ? '' : `<button class="btn btn-mini so-editor" onclick="desfazerDevolucao('${v.id_devolucao}', '')">Desfazer</button>`}</td></tr>`).join('')}
        </tbody></table>` : '<div class="vazio">Nenhuma devolução registrada.</div>'}</div></div>`;
  }
  // ── Conciliação pedido × empenho (mesma conta no Orçamento e no Monitoramento) ──
  function htmlConciliacao(cc) {
    const t = cc.total;
    const tab = (lista, rotulo) => lista.length ? `<table><thead><tr><th>${rotulo}</th><th class="num">Aprovado (real)</th><th class="num">Solicitado</th><th class="num">Empenhado</th><th class="num">A empenhar</th><th class="num">Liquidado</th><th></th></tr></thead><tbody>
      ${lista.map(x => `<tr><td>${esc(x.nome)}<span class="sub">${x.n} requisição(ões)</span></td>
        <td class="num">${fmtV(x.aprovado)}</td><td class="num">${fmtV(x.solicitado)}</td><td class="num">${fmtV(x.empenhado)}</td>
        <td class="num">${x.a_empenhar > 0.005 ? `<b style="color:#7A4A00">${fmtV(x.a_empenhar)}</b>` : '—'}</td>
        <td class="num">${fmtV(x.liquidado)}</td>
        <td style="min-width:90px">${barra(x.empenhado, x.aprovado)}</td></tr>`).join('')}
      <tr><td><b>Total</b></td><td class="num"><b>${fmtV(lista.reduce((s, x) => s + x.aprovado, 0))}</b></td><td class="num"><b>${fmtV(lista.reduce((s, x) => s + x.solicitado, 0))}</b></td>
        <td class="num"><b>${fmtV(lista.reduce((s, x) => s + x.empenhado, 0))}</b></td><td class="num"><b>${fmtV(lista.reduce((s, x) => s + x.a_empenhar, 0))}</b></td>
        <td class="num"><b>${fmtV(lista.reduce((s, x) => s + x.liquidado, 0))}</b></td><td></td></tr>
      </tbody></table>` : '<div class="vazio">Nenhuma requisição aprovada neste filtro.</div>';
    const bate = Math.abs(t.sem_vinculo) < 0.005;
    return `
      <div class="cadeia">
        <div class="elo"><span>Aprovado (real)</span><b>${fmtV(t.aprovado)}</b><small>requisições aprovadas</small></div>
        <div class="elo"><span>Solicitado</span><b>${fmtV(t.solicitado)}</b><small>em solicitação enviada</small></div>
        <div class="elo"><span>Empenhado</span><b>${fmtV(t.empenhado)}</b><small>o que os empenhos cobrem</small></div>
        <div class="elo"><span>A empenhar</span><b>${fmtV(t.a_empenhar)}</b><small>solicitado − empenhado</small></div>
        <div class="elo" style="${bate ? '' : 'background:#FCEBEB'}"><span>Empenho sem vínculo</span><b class="${bate ? '' : 'alerta-num'}">${fmtV(t.sem_vinculo)}</b><small>${bate ? 'empenhos totalmente vinculados' : 'valor dos empenhos − o que cobrem'}</small></div>
      </div>
      ${!bate ? `<div class="aviso"><b>Há empenho sem vínculo.</b> A soma dos empenhos (${fmtV(t.empenhos)}) não bate com a soma do que eles cobrem (${fmtV(t.empenhado)}).
        ${cc.sem_vinculo.map(e => `<span class="cod-dem" style="margin-left:6px">${esc(e.numero)}: ${fmtV(e.sem_vinculo)}</span>`).join('')}</div>`
        : `<div class="ok-box" style="margin-bottom:18px">A soma dos empenhos é igual à soma do que eles cobrem nas requisições.</div>`}
      <div class="secao"><div class="secao-header"><span class="secao-titulo">Por contrato, ata ou forma de atendimento</span></div><div class="tabela-scroll">${tab(cc.por_instrumento, 'Instrumento')}</div></div>
      <div class="secao"><div class="secao-header"><span class="secao-titulo">Por unidade requerente</span></div><div class="tabela-scroll">${tab(cc.por_unidade, 'Unidade')}</div></div>`;
  }


</script>
</body>
</html>
