<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PMO — Contratos, atas e DFDs</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #F1EFE8; color: #2C2C2A; min-height: 100vh; }
  .topbar { background: #3C3489; height: 56px; display: flex; align-items: center; padding: 0 24px; gap: 16px; position: sticky; top: 0; z-index: 100; }
  .topbar-logo { font-size: 15px; font-weight: 700; color: #fff; flex-shrink: 0; }
  .topbar-sub  { font-size: 12px; color: rgba(255,255,255,0.55); border-left: 1px solid rgba(255,255,255,0.2); padding-left: 14px; }
  .topbar-spacer { flex: 1; }
  .topbar-usuario { display: flex; align-items: center; gap: 10px; font-size: 13px; color: rgba(255,255,255,0.85); }
  .avatar { width: 32px; height: 32px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #fff; flex-shrink: 0; }
  .btn-logout { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; padding: 5px 12px; font-size: 12px; color: rgba(255,255,255,0.85); cursor: pointer; }
  .layout { display: flex; min-height: calc(100vh - 56px); }
  .sidebar { width: 220px; background: #fff; border-right: 1px solid #D3D1C7; padding: 20px 0; flex-shrink: 0; }
  .nav-titulo { font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #B4B2A9; padding: 0 18px 6px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 18px; font-size: 13px; color: #5F5E5A; text-decoration: none; border-left: 3px solid transparent; cursor: pointer; }
  .nav-item:hover { background: #F1EFE8; color: #2C2C2A; }
  .nav-item.ativo { background: #EEEDFE; color: #3C3489; border-left-color: #3C3489; font-weight: 500; }
  .nav-item svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; }
  .main { flex: 1; padding: 28px 32px; max-width: 1240px; min-width: 0; }
  .cabecalho { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .page-title { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .page-sub { font-size: 13px; color: #888780; }
  .escopo { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #5F5E5A; }
  .escopo select { padding: 7px 10px; border: 1px solid #D3D1C7; border-radius: 7px; font-size: 13px; background: #fff; min-width: 240px; }
  .selo { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: #F1EFE8; color: #5F5E5A; }

  .abas { display: flex; gap: 4px; border-bottom: 1px solid #D3D1C7; margin-bottom: 18px; flex-wrap: wrap; }
  .aba { background: none; border: none; border-bottom: 2px solid transparent; padding: 9px 14px; font-size: 13px; color: #5F5E5A; cursor: pointer; margin-bottom: -1px; }
  .aba:hover { color: #2C2C2A; }
  .aba.ativa { color: #3C3489; border-bottom-color: #3C3489; font-weight: 600; }
  .aba .cnt { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 99px; font-size: 10.5px; font-weight: 700; background: #FCEBEB; color: #A32D2D; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .card { background: #fff; border: 1px solid #D3D1C7; border-radius: 12px; padding: 14px 16px; }
  .card-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; color: #888780; margin-bottom: 6px; }
  .card-valor { font-size: 19px; font-weight: 600; }
  .card-det { font-size: 11.5px; color: #888780; margin-top: 3px; }
  .card.vermelho .card-valor { color: #A32D2D; } .card.amarelo .card-valor { color: #7A4A00; }

  .secao { background: #fff; border: 1px solid #D3D1C7; border-radius: 12px; overflow: hidden; margin-bottom: 18px; }
  .secao-header { padding: 13px 18px; border-bottom: 1px solid #F1EFE8; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .secao-titulo { font-size: 14px; font-weight: 600; flex: 1; }
  .grade2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 1100px) { .grade2 { grid-template-columns: 1fr; } }

  table { width: 100%; border-collapse: collapse; }
  th { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; color: #888780; padding: 9px 12px; text-align: left; background: #FAFAF8; border-bottom: 1px solid #F1EFE8; white-space: nowrap; }
  th.num, td.num { text-align: right; }
  td { font-size: 13px; padding: 9px 12px; border-bottom: 1px solid #F8F7F4; vertical-align: middle; }
  td.num { white-space: nowrap; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  tbody tr.clicavel { cursor: pointer; } tbody tr.clicavel:hover td { background: #FAFAF8; }
  .tabela-scroll { overflow-x: auto; }

  .cod-dem { display: inline-block; font-size: 10.5px; font-weight: 700; color: #3C3489; background: #EEEDFE; border-radius: 4px; padding: 1px 6px; margin-bottom: 3px; white-space: nowrap; }
  .sub { display: block; font-size: 11px; color: #888780; margin-top: 2px; }
  .barra { height: 6px; background: #F1EFE8; border-radius: 99px; overflow: hidden; min-width: 70px; }
  .barra > div { height: 100%; background: #534AB7; border-radius: 99px; }
  .barra.pago > div { background: #1D9E75; }

  .sit { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .sit-aguardando { background: #F1EFE8; color: #5F5E5A; }
  .sit-em_contratacao { background: #E6F1FB; color: #0C447C; }
  .sit-empenhada { background: #EEEDFE; color: #3C3489; }
  .sit-em_execucao { background: #FAEEDA; color: #633806; }
  .sit-concluida { background: #E1F5EE; color: #085041; }
  .sit-nao_executada { background: #FCEBEB; color: #791F1F; }

  .sem { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; white-space: nowrap; }
  .sem::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: #D3D1C7; flex-shrink: 0; }
  .sem-vencido::before { background: #E24B4A; } .sem-vencido { color: #A32D2D; font-weight: 600; }
  .sem-a_vencer::before { background: #EF9F27; } .sem-a_vencer { color: #7A4A00; font-weight: 600; }
  .sem-no_prazo::before { background: #1D9E75; }
  .sem-cumprido::before { background: #1D9E75; } .sem-cumprido { color: #085041; }
  .sem-cumprido_atraso::before { background: #B4B2A9; } .sem-cumprido_atraso { color: #5F5E5A; }
  .sem-sem_prazo { color: #888780; } .sem-nao_aplica { color: #B4B2A9; }

  .filtros { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .filtros select, .filtros input { padding: 6px 10px; border: 1px solid #D3D1C7; border-radius: 7px; font-size: 12.5px; background: #fff; }
  .btn { border: 1px solid #D3D1C7; background: #fff; color: #444441; border-radius: 7px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: #F1EFE8; }
  .btn-p { background: #3C3489; border-color: #3C3489; color: #fff; font-weight: 600; } .btn-p:hover { background: #534AB7; }
  .btn-v { background: #085041; border-color: #085041; color: #fff; font-weight: 600; } .btn-v:hover { background: #0F6E56; }
  .btn-r { color: #A32D2D; border-color: #F7C1C1; } .btn-r:hover { background: #FCEBEB; }
  .btn-mini { padding: 3px 8px; font-size: 11.5px; }
  .so-editor { } body.leitura .so-editor { display: none !important; }

  .carregando, .vazio { text-align: center; padding: 34px; color: #B4B2A9; font-size: 13px; }
  .grupo-un { padding: 10px 18px; background: #FAFAF8; font-size: 12px; font-weight: 700; color: #5F5E5A; border-bottom: 1px solid #F1EFE8; }

  /* Modal */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; overflow-y: auto; padding: 24px; }
  .overlay.aberto { display: flex; align-items: flex-start; justify-content: center; }
  .modal { background: #fff; border-radius: 14px; width: 100%; max-width: 980px; margin: auto; }
  .modal.estreito { max-width: 560px; }
  .modal-header { display: flex; align-items: flex-start; gap: 12px; padding: 20px 24px 14px; border-bottom: 1px solid #F1EFE8; }
  .modal-titulo { font-size: 16px; font-weight: 600; flex: 1; line-height: 1.4; }
  .modal-fechar { background: none; border: none; font-size: 20px; color: #888780; cursor: pointer; line-height: 1; }
  .modal-corpo { padding: 18px 24px 22px; }
  .bloco { margin-bottom: 20px; }
  .bloco-titulo { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #888780; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .bloco-titulo .btn + .btn { margin-left: 0; }
  #in-partes select { width: 100%; max-width: 520px; padding: 6px 8px; border: 1px solid #D3D1C7; border-radius: 7px; font-size: 13px; font-family: inherit; background: #fff; }
  .bloco-titulo .btn { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; }
  .caixa { border: 1px solid #F1EFE8; border-radius: 10px; overflow: hidden; }
  .form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .campo { display: flex; flex-direction: column; gap: 4px; }
  .campo.largo { grid-column: 1 / -1; }
  .campo label { font-size: 12px; font-weight: 600; color: #444441; }
  .campo input, .campo select, .campo textarea { padding: 8px 10px; border: 1px solid #D3D1C7; border-radius: 7px; font-size: 13px; font-family: inherit; }
  .campo input:focus, .campo select:focus, .campo textarea:focus { outline: none; border-color: #534AB7; box-shadow: 0 0 0 3px rgba(83,74,183,0.1); }
  .campo .hint { font-size: 11px; color: #B4B2A9; }
  .rodape { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .msg-erro { background: #FCEBEB; border: 1px solid #F7C1C1; border-radius: 8px; padding: 8px 12px; font-size: 13px; color: #791F1F; margin-bottom: 12px; display: none; }
  .msg-erro.vis { display: block; }
  .mini-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .mini { background: #FAFAF8; border-radius: 9px; padding: 10px 12px; }
  .mini b { display: block; font-size: 15px; margin-top: 2px; }
  .mini span { font-size: 11px; color: #888780; }
  .linha-cob { padding: 9px 12px; border-bottom: 1px solid #F8F7F4; font-size: 12.5px; }
  .linha-cob:last-child { border-bottom: none; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: #2C2C2A; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px; z-index: 400; display: none; }
  .toast.vis { display: block; }

  .st { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .st-aguardando_contratacao { background: #FAEEDA; color: #633806; }
  .st-aguardando_gestor { background: #E6F1FB; color: #0C447C; }
  .st-pendente { background: #FCEBEB; color: #791F1F; }
  .st-aprovada { background: #E1F5EE; color: #085041; }
  .st-em_solicitacao, .st-empenhada { background: #EEEDFE; color: #3C3489; }
  .st-liquidada, .st-paga { background: #D7F0E6; color: #04342A; }
  .st-cancelada, .st-encerrado, .st-fracassado { background: #F1EFE8; color: #888780; }
  .st-vigente, .st-em_andamento { background: #E6F1FB; color: #0C447C; }
  .st-concluido { background: #E1F5EE; color: #085041; }
  .cod-req { display: inline-block; font-size: 10.5px; font-weight: 700; color: #085041; background: #E1F5EE; border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
  .aviso { background: #FCEBEB; border: 1px solid #F7C1C1; border-radius: 10px; padding: 12px 16px; margin-bottom: 18px; font-size: 13px; color: #791F1F; }
  .aviso b { color: #A32D2D; }
  .info { background: #F4F3FE; border: 1px solid #DAD7F7; border-radius: 10px; padding: 10px 14px; font-size: 12.5px; color: #3C3489; }
  .ok-box { background: #E1F5EE; border: 1px solid #B4E3D2; border-radius: 10px; padding: 10px 14px; font-size: 12.5px; color: #085041; }
  .bad-box { background: #FCEBEB; border: 1px solid #F7C1C1; border-radius: 10px; padding: 10px 14px; font-size: 12.5px; color: #791F1F; }
  .dados-dem { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 16px; background: #FAFAF8; border-radius: 10px; padding: 12px 14px; font-size: 12.5px; }
  .dados-dem span { display: block; font-size: 10.5px; color: #888780; text-transform: uppercase; letter-spacing: .3px; }
  .dados-dem b { font-weight: 600; }
  .dados-dem .largo { grid-column: 1 / -1; }
  .formas { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .forma { border: 1px solid #D3D1C7; border-radius: 9px; padding: 9px 11px; cursor: pointer; font-size: 12.5px; display: flex; gap: 8px; align-items: flex-start; }
  .forma:hover { background: #FAFAF8; }
  .forma input { margin-top: 2px; }
  .forma.sel { border-color: #534AB7; background: #F4F3FE; }
  .forma small { display: block; font-size: 11px; color: #888780; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; background: #FAEEDA; border-radius: 9px; padding: 10px 12px; color: #633806; }
  .inst-card { border-top: 3px solid #534AB7; }
  .inst-meta { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: #5F5E5A; }
  .inst-meta b { color: #2C2C2A; }
  .hist { font-size: 12.5px; }
  .hist div { padding: 8px 12px; border-bottom: 1px solid #F8F7F4; }
  .hist div:last-child { border-bottom: none; }
  .dias { font-size: 11px; color: #888780; }
  .btn:disabled, .btn:disabled:hover { opacity: .4; cursor: not-allowed; }
  .modal.extra { max-width: 1240px; }
  .tab-itens td { padding: 4px 5px; } .tab-itens th { padding: 7px 6px; }
  .tab-itens input { width: 100%; padding: 5px 6px; border: 1px solid #D3D1C7; border-radius: 6px; font-size: 12.5px; font-family: inherit; }
  .tab-itens input:disabled { background: #F5F4F0; color: #888780; }
  input.num { text-align: right; }
  .st-em_elaboracao { background: #FAEEDA; color: #633806; } .st-em_contratacao { background: #E6F1FB; color: #0C447C; }
  .st-cancelado { background: #F1EFE8; color: #888780; }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-logo" title="Planejamento e Monitoramento Orçamentário">PMO</span>
  <span class="topbar-sub">Contratos, atas e DFDs</span>
  <div style="display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:6px;padding:4px 10px;">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <select id="sel-exercicio" style="background:transparent;border:none;color:#fff;font-size:12px;font-weight:600;cursor:pointer;outline:none;padding:0 2px;" onchange="trocarExercicio(this.value)"></select>
  </div>
  <div class="topbar-spacer"></div>
  <div class="topbar-usuario">
    <div class="avatar" id="av">?</div>
    <div>
      <div style="font-weight:500" id="nome-usuario">Carregando...</div>
      <div style="font-size:11px;opacity:0.7" id="unidade-usuario"></div>
    </div>
    <button class="btn-logout" onclick="fazerLogout()">Sair</button>
  </div>
</div>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main">
    <div class="cabecalho">
      <div>
        <div class="page-title">Contratos, atas e DFDs</div>
        <div class="page-sub">Instrumentos que atendem as requisições, com os itens e as quantidades de cada polo (Reitoria e campi)</div>
      </div>
      <button class="btn btn-p" id="btn-novo" style="margin-left:auto;display:none" onclick="formInstrumento({})">+ Novo instrumento</button>
    </div>
    <div id="conteudo"><div class="carregando">Carregando…</div></div>
  </main>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this) fecharModal()">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-titulo" id="modal-titulo"></div>
      <button class="modal-fechar" onclick="fecharModal()" aria-label="Fechar">×</button>
    </div>
    <div class="modal-corpo"><div class="msg-erro" id="modal-erro"></div><div id="modal-corpo"></div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="api.js?v=202611191500"></script>
<script>
  const token = localStorage.getItem('pac_token') || '';
  let _usuario = null, _ctx = null, _dados = null;
  const PAGINA_ATUAL = 'instrumentos';

  // ── Utilitários ───────────────────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function fmtV(v) { return 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fmtN(v) { return Number(v || 0).toLocaleString('pt-BR', { maximumFractionDigits: 3 }); }
  function fmtD(d) { if (!d) return '—'; const s = String(d).slice(0, 10); return s.slice(8,10) + '/' + s.slice(5,7) + '/' + s.slice(0,4); }
  function fmtDH(d) { if (!d) return '—'; try { return new Date(d).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }); } catch (e) { return '—'; } }
  function diasDesde(d) { if (!d) return ''; const n = Math.floor((Date.now() - new Date(d).getTime()) / 864e5); return n <= 0 ? 'hoje' : n === 1 ? 'há 1 dia' : 'há ' + n + ' dias'; }
  function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
  function barra(a, b) { const p = Math.min(100, pct(a, b)); return `<div class="barra" title="${p}%"><div style="width:${p}%"></div></div>`; }
  function num(v) { const n = parseFloat(String(v).replace(/\./g, '').replace(',', '.')); return isNaN(n) ? 0 : n; }
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('vis'); setTimeout(() => t.classList.remove('vis'), 2600); }
  function chamar(acao, params) {
    return new Promise(ok => google.script.run.withSuccessHandler(ok)
      .withFailureHandler(e => ok({ ok: false, erro: e.message })).chamarAcao(token, acao, JSON.stringify(params || {})));
  }
  const SIT_REQ = { aguardando_contratacao: 'Aguardando processo de contratação', aguardando_gestor: 'Aguardando o gestor',
    pendente: 'Pendente: devolvida', aprovada: 'Aprovada', em_solicitacao: 'Em solicitação de empenho',
    empenhada: 'Empenhada', liquidada: 'Liquidada', paga: 'Paga', cancelada: 'Cancelada' };
  const FORMAS = { contrato: 'Contrato vigente', ata: 'Ata de registro de preços', nova_contratacao: 'Nova contratação',
    bolsas_editais: 'Bolsas e editais', diarias: 'Diárias', outros: 'Outros' };
  const TIPOS_INST = { contrato: 'Contrato', ata: 'Ata de RP', dfd: 'DFD' };
  const SIT_INST = { vigente: 'Vigente', encerrado: 'Encerrado', em_elaboracao: 'Em elaboração', em_contratacao: 'Em contratação', concluido: 'Concluído', cancelado: 'Cancelado' };
  function stReq(s) { return `<span class="st st-${s}">${esc(SIT_REQ[s] || s)}</span>`; }
  function stInst(s) { return `<span class="st st-${s}">${esc(SIT_INST[s] || s)}</span>`; }
  function abrirModal(titulo, html, largo) {
    $('modal-titulo').innerHTML = titulo; $('modal-corpo').innerHTML = html;
    $('modal').classList.toggle('estreito', !largo);
    $('modal-erro').classList.remove('vis'); $('overlay').classList.add('aberto');
  }
  function fecharModal() { $('overlay').classList.remove('aberto'); }
  function erroModal(m) { const e = $('modal-erro'); e.textContent = m; e.classList.add('vis'); e.scrollIntoView({ block: 'nearest' }); }

  // ── Exercício e navegação ─────────────────────────────────────────────────
  function getExercicio() { return sessionStorage.getItem('pac_exercicio') || ''; }
  function trocarExercicio(ano) { sessionStorage.setItem('pac_exercicio', String(ano)); carregar(); }
  function popularSeletorExercicios(atualCfg) {
    const base = Number(atualCfg) || new Date().getFullYear();
    const atual = getExercicio() || base;
    const anos = PMO_ANOS();
    $('sel-exercicio').innerHTML = anos.map(a => `<option value="${a}" style="background:#3C3489;color:#fff"${String(a)===String(atual)?' selected':''}>${a}</option>`).join('');
    if (!getExercicio()) sessionStorage.setItem('pac_exercicio', String(base));
  }
  function navegar(page) { window.location.href = _pacUrlPagina(page); }
  function fazerLogout() { google.script.run.chamarAcao(token, 'logout', '{}'); try { localStorage.removeItem('pac_token'); } catch (e) {} navegar('login'); }

  (async function iniciar() {
    const r = await chamar('dados_usuario');
    if (!r.ok) { navegar('login'); return; }
    _usuario = r.usuario;
    $('av').textContent = _usuario.nome.charAt(0).toUpperCase();
    $('nome-usuario').textContent = _usuario.nome;
    $('unidade-usuario').textContent = _usuario.sigla || _usuario.unidade || '';
    const menus = PMO_MENUS[_usuario.papel] || [];
    $('sidebar').innerHTML = '<div class="nav-titulo" style="margin-top:8px">Menu</div>' + menus.map(m =>
      `<a class="nav-item${m.page===PAGINA_ATUAL?' ativo':''}" href="#" onclick="navegar('${m.page}');return false;"><svg viewBox="0 0 24 24">${PMO_ICONS[m.icon]||''}</svg> ${m.label}</a>`).join('');
    _ctx = await chamar('req_contexto');
    if (!_ctx.ok) { $('conteudo').innerHTML = `<div class="vazio">${esc(_ctx.erro)}</div>`; return; }
    popularSeletorExercicios(_ctx.exercicio);
    iniciarPagina();
  })();

  let _tipo = '', _sit = '', _busca = '', _polo = '';
  const TIPOS_ALT = { acrescimo: 'Acréscimo de quantidade', supressao: 'Supressão de quantidade', reajuste: 'Reajuste de preço', correcao: 'Correção', inclusao_item: 'Inclusão de item' };
  const siglaPolo = id => { const p = (_ctx.polos || []).find(x => x.id === id); return p ? (p.nome.startsWith('Reitoria') ? 'Reitoria' : p.sigla) : '—'; };
  const nomeUn = id => { const u = (_ctx.unidades || []).find(x => x.id === id); return u ? u.sigla : '—'; };
  function iniciarPagina() {
    if (_ctx.pode_cadastrar) $('btn-novo').style.display = '';
    carregar();
  }
  async function carregar() {
    const r = await chamar('inst_listar');
    if (!r.ok) { $('conteudo').innerHTML = `<div class="vazio">${esc(r.erro)}</div>`; return; }
    _dados = r; render();
  }
  function participantesTxt(i) {
    if (i.tipo === 'dfd') return `${esc(i.sigla_demandante || '—')}<span class="sub">polo ${esc(siglaPolo(i.id_polo))}</span>`;
    const P = i.participantes || [];
    if (!P.length) return '<span class="sub" style="color:#A32D2D">sem participante</span>';
    return P.map(p => `<div style="white-space:nowrap">${esc(siglaPolo(p.id_polo))}${p.id_polo === i.id_polo && i.tipo === 'ata' && P.length > 1 ? ' <small>(gerenciador)</small>' : ''} <span class="sub" style="display:inline">· ${esc(p.sigla_gestora)}</span></div>`).join('');
  }
  function render() {
    const I = _dados.instrumentos;
    const lista = I.filter(i => (!_tipo || i.tipo === _tipo) && (!_sit || i.situacao === _sit) &&
      (!_polo || i.id_polo === _polo || (i.participantes || []).some(p => p.id_polo === _polo)) &&
      (!_busca || [i.numero, i.objeto, i.fornecedor_nome, i.sigla_gestora, i.processo_sei, i.sigla_demandante].some(v => String(v||'').toLowerCase().includes(_busca.toLowerCase()))));
    const n = t => I.filter(i => i.tipo === t).length;
    $('conteudo').innerHTML = `
      <div class="cards">
        <div class="card"><div class="card-label">Contratos</div><div class="card-valor">${n('contrato')}</div><div class="card-det">${I.filter(i => i.tipo==='contrato' && i.disponivel).length} vigente(s)</div></div>
        <div class="card"><div class="card-label">Atas de RP</div><div class="card-valor">${n('ata')}</div><div class="card-det">${I.filter(i => i.tipo==='ata' && i.disponivel).length} vigente(s)</div></div>
        <div class="card"><div class="card-label">DFDs</div><div class="card-valor">${n('dfd')}</div><div class="card-det">${I.filter(i => i.tipo==='dfd' && ['em_elaboracao','em_contratacao'].includes(i.situacao)).length} em andamento</div></div>
      </div>
      <div class="secao"><div class="secao-header"><span class="secao-titulo">${lista.length} instrumento(s)</span>
        <div class="filtros">
          <select onchange="_tipo=this.value;render()"><option value="">Todos os tipos</option>${Object.entries(TIPOS_INST).map(([k, v]) => `<option value="${k}"${k===_tipo?' selected':''}>${v}</option>`).join('')}</select>
          <select onchange="_polo=this.value;render()" data-sem-busca><option value="">Todos os polos</option>${(_ctx.polos||[]).map(p => `<option value="${p.id}"${p.id===_polo?' selected':''}>${esc(siglaPolo(p.id))}</option>`).join('')}</select>
          <select onchange="_sit=this.value;render()"><option value="">Todas as situações</option>${Object.entries(SIT_INST).map(([k, v]) => `<option value="${k}"${k===_sit?' selected':''}>${v}</option>`).join('')}</select>
          <input type="search" placeholder="Número, objeto, fornecedor, seção…" value="${esc(_busca)}" oninput="_busca=this.value;clearTimeout(window._tb);window._tb=setTimeout(render,250)">
        </div></div>
        <div class="tabela-scroll">${lista.length ? `<table><thead><tr><th>Instrumento</th><th>Objeto</th><th>Fornecedor</th><th>Polos e gestão</th><th>Vigência</th><th class="num">Valor</th><th class="num">Aprovado</th><th>Situação</th><th class="num">Req.</th></tr></thead><tbody>
          ${lista.map(i => `<tr class="clicavel" onclick="abrirInstrumento('${i.id_instrumento}')">
            <td><b>${esc(i.numero)}</b><span class="sub">${esc(TIPOS_INST[i.tipo]||i.tipo)}${i.numero_processo_origem ? ' · do DFD ' + esc(i.numero_processo_origem) : ''}${i.tipo !== 'dfd' ? ' · ' + (i.n_itens || 0) + ' item(ns)' : ''}</span></td>
            <td style="max-width:240px">${esc(i.objeto)}</td>
            <td>${i.tipo === 'dfd' ? '—' : esc(i.fornecedor_nome||'—')}<span class="sub">${esc(i.fornecedor_cnpj||'')}</span></td>
            <td>${participantesTxt(i)}</td>
            <td>${i.tipo === 'dfd' ? (i.data_dfd ? 'DFD de ' + fmtD(i.data_dfd) : '—') : i.vigencia_fim ? (i.vigencia_inicio ? fmtD(i.vigencia_inicio) + ' a ' : 'até ') + fmtD(i.vigencia_fim) : '—'}</td>
            <td class="num">${i.tipo === 'dfd' ? (i.valor_estimado != null ? fmtV(i.valor_estimado) + '<span class="sub">estimado</span>' : '—') : i.valor_limite != null ? fmtV(i.valor_limite) : '—'}</td>
            <td class="num">${i.tipo === 'dfd' ? '—' : i.valor_limite ? `${fmtV(i.consumido)}${barra(i.consumido, i.valor_limite)}` : '—'}</td>
            <td>${stInst(i.situacao)}</td><td class="num">${i.n_requisicoes || '—'}</td></tr>`).join('')}
          </tbody></table>` : `<div class="vazio">${I.length ? 'Nenhum instrumento neste filtro.' : 'Nenhum instrumento cadastrado. Use “+ Novo instrumento”.'}</div>`}</div></div>`;
  }

  // ── Ficha ─────────────────────────────────────────────────────────────────
  async function abrirInstrumento(id) {
    abrirModal('Carregando…', '<div class="carregando">Carregando…</div>', true);
    const r = await chamar('inst_detalhe', { id_instrumento: id });
    if (!r.ok) { $('modal-corpo').innerHTML = `<div class="vazio">${esc(r.erro)}</div>`; return; }
    window._det = r; fichaInstrumento();
  }
  function fichaInstrumento() {
    const { instrumento: i, itens, saldos, alteracoes, requisicoes, sem_dfd } = window._det;
    const ed = _ctx.pode_cadastrar;
    const P = i.participantes || [];
    const kv = (rot, val) => `<div><span>${rot}</span><b>${val}</b></div>`;
    const sal = (idItem, idPolo) => saldos.find(s => s.id_item === idItem && s.id_polo === idPolo);
    const tabelaItens = !itens.length ? '<div class="vazio" style="padding:14px">Nenhum item cadastrado.</div>' : `<div class="tabela-scroll"><table><thead><tr>
        <th>Grupo / item</th><th>Descrição</th><th>Unidade</th><th class="num">Valor unitário</th>
        ${P.map(p => `<th class="num">${esc(siglaPolo(p.id_polo))}<br><small>registrado · aprovado · saldo</small></th>`).join('')}</tr></thead><tbody>
      ${itens.map(it => `<tr><td style="white-space:nowrap">${it.grupo ? 'G' + esc(it.grupo) + ' · ' : ''}<b>${esc(it.numero_item)}</b></td>
        <td style="max-width:280px">${esc(it.descricao)}${it.natureza_despesa ? `<span class="sub">ND ${esc(it.natureza_despesa)}</span>` : ''}</td>
        <td>${esc(it.unidade_medida)}</td><td class="num">${fmtV4(it.valor_unitario)}</td>
        ${P.map(p => { const s = sal(it.id_item, p.id_polo) || { registrado: 0, aprovado: 0, saldo: 0, em_analise: 0 };
          return `<td class="num">${fmtN(s.registrado)} · ${fmtN(s.aprovado)} · <b style="color:${s.saldo > 0 ? '#085041' : '#A32D2D'}">${fmtN(s.saldo)}</b>
            ${s.registrado ? `<div style="max-width:120px;margin-left:auto;margin-top:3px">${barra(s.aprovado, s.registrado)}</div>` : ''}${s.em_analise ? `<span class="sub">${fmtN(s.em_analise)} em análise</span>` : ''}</td>`; }).join('')}</tr>`).join('')}
      </tbody></table></div>`;
    abrirModal(`${esc(TIPOS_INST[i.tipo])} ${esc(i.numero)} ${stInst(i.situacao)}<span class="sub">${esc(i.objeto)}</span>`, `
      ${i.tipo !== 'dfd' ? `<div class="mini-cards">
        <div class="mini"><span>Valor total (itens)</span><b>${fmtV(i.valor_limite)}</b></div>
        <div class="mini"><span>Aprovado em requisições</span><b>${fmtV(i.consumido)}</b></div>
        <div class="mini"><span>Itens</span><b>${itens.length}</b></div>
        <div class="mini"><span>Requisições</span><b>${requisicoes.length}</b></div></div>` : ''}
      <div class="bloco"><div class="bloco-titulo">Dados</div><div class="dados-dem">
        ${i.tipo === 'dfd' ? kv('Unidade demandante', esc(i.sigla_demandante || '—')) + kv('Polo', esc(siglaPolo(i.id_polo))) + kv('Data do DFD', fmtD(i.data_dfd))
            + kv('Valor estimado', i.valor_estimado != null ? fmtV(i.valor_estimado) : '—')
          : kv('Fornecedor', esc(i.fornecedor_nome || '—') + (i.fornecedor_cnpj ? `<div style="font-size:11px;color:#888780">${esc(i.fornecedor_cnpj)}</div>` : ''))
            + kv('Vigência', i.vigencia_fim ? (i.vigencia_inicio ? fmtD(i.vigencia_inicio) + ' a ' : 'até ') + fmtD(i.vigencia_fim) : '—')
            + kv('Gerado do DFD', esc(i.numero_processo_origem || '—'))}
        ${kv('Processo SUAP', esc(i.processo_sei || '—'))}
        ${i.observacao ? `<div class="largo"><span>Observação</span>${esc(i.observacao)}</div>` : ''}
      </div></div>
      ${i.tipo !== 'dfd' ? `<div class="bloco"><div class="bloco-titulo">Participantes</div><div class="dados-dem">
          ${P.map(p => kv(esc(siglaPolo(p.id_polo)) + (p.id_polo === i.id_polo && i.tipo === 'ata' && P.length > 1 ? ' — gerenciador' : ''), 'Gestão ' + esc(p.sigla_gestora) + `<div style="font-size:11px;color:#888780">${esc(p.nome_gestora || '')}</div>`)).join('')}
        </div></div>
        <div class="bloco"><div class="bloco-titulo">Itens e saldo por polo</div><div class="caixa">${tabelaItens}</div></div>
        <div class="bloco"><div class="bloco-titulo">Aditivos, apostilamentos e correções</div><div class="caixa hist">
          ${alteracoes.length ? alteracoes.map(a => `<div><b>${fmtD(a.data || a.data_hora)}</b> · ${esc(TIPOS_ALT[a.tipo] || a.tipo)} · item ${esc(a.item ? (a.item.grupo ? 'G' + a.item.grupo + '/' : '') + a.item.numero_item : '—')}${a.id_polo ? ' · ' + esc(siglaPolo(a.id_polo)) : ''}
              · ${a.quantidade_antes != null || a.quantidade_depois != null ? `quantidade ${fmtN(a.quantidade_antes)} → <b>${fmtN(a.quantidade_depois)}</b>` : `preço ${a.valor_antes != null ? fmtV4(a.valor_antes) : '—'} → <b>${fmtV4(a.valor_depois)}</b>`}
              ${a.documento ? ' · ' + esc(a.documento) : ''}${a.autor ? ' · ' + esc(a.autor) : ''}${a.observacao ? `<span class="sub">${esc(a.observacao)}</span>` : ''}</div>`).join('') : '<div>Nenhuma alteração registrada.</div>'}
        </div></div>` : ''}
      <div class="bloco"><div class="bloco-titulo">Requisições ${i.tipo === 'dfd' ? 'vinculadas' : ''}</div><div class="caixa">
        ${requisicoes.length ? `<table><tbody>${requisicoes.map(x => `<tr><td><span class="cod-req">${esc(x.codigo)}</span><span class="sub">${esc(x.codigo_demanda)}</span></td>
          <td>${esc(x.sigla_unidade)}</td><td style="max-width:280px">${esc(x.descricao_objeto)}</td><td class="num">${fmtV(x.valor)}${x.valor_real ? `<span class="sub">real ${fmtV(x.valor_real)}</span>` : ''}</td><td>${stReq(x.situacao)}</td></tr>`).join('')}</tbody></table>`
          : '<div class="vazio" style="padding:14px">Nenhuma requisição.</div>'}</div></div>
      ${i.tipo === 'dfd' && sem_dfd.length && ed ? `<div class="bloco"><div class="bloco-titulo">Requisições de nova contratação do polo ainda sem DFD</div><div class="caixa"><table><tbody>
        ${sem_dfd.map(x => `<tr><td><span class="cod-req">${esc(x.codigo)}</span><span class="sub">${esc(x.codigo_demanda)}</span></td><td>${esc(x.sigla_unidade)}</td>
          <td style="max-width:300px">${esc(x.descricao_objeto)}</td><td class="num">${fmtV(x.valor)}</td>
          <td style="text-align:right"><button class="btn btn-mini" onclick="vincularDfd('${x.id_requisicao}','${i.id_instrumento}')">Vincular a este DFD</button></td></tr>`).join('')}</tbody></table></div></div>` : ''}
      <div class="rodape">
        ${ed && !requisicoes.length ? `<button class="btn btn-r" style="margin-right:auto" onclick="excluirInstrumento('${i.id_instrumento}')">Excluir</button>` : ''}
        ${ed && i.tipo === 'dfd' && ['em_elaboracao','em_contratacao'].includes(i.situacao) ? `<button class="btn" onclick="formInstrumento(null, '${i.id_instrumento}')">Registrar ata ou contrato resultante</button>` : ''}
        ${ed && i.tipo !== 'dfd' && itens.length ? `<button class="btn" onclick="formAlteracao()">Registrar alteração</button>` : ''}
        <button class="btn" onclick="fecharModal()">Fechar</button>
        ${ed ? `<button class="btn btn-p" onclick="formInstrumento(window._det)">Editar</button>` : ''}</div>`, true);
    $('modal').classList.add('extra');
  }
  async function vincularDfd(idReq, idDfd) {
    const r = await chamar('dfd_vincular', { id_requisicao: idReq, id_dfd: idDfd });
    if (!r.ok) return erroModal(r.erro);
    toast('Requisição vinculada ao DFD.'); abrirInstrumento(idDfd);
  }

  // ── Formulário (novo, edição, ou contrato/ata gerado de um DFD) ───────────
  // Número digitado ou colado do Excel: "1.234,56" (pt-BR), "25,5", "25.5" ou "1.500" (milhar).
  function numBR(v) {
    let t = String(v == null ? '' : v).trim().replace(/[R$\s]/g, '');
    if (!t) return 0;
    if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
    const n = parseFloat(t); return isNaN(n) ? 0 : n;
  }
  function fmtV4(v) { return 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 4 }); }
  function opcoesUnidades(sel, filtro) {
    return _ctx.unidades.filter(u => !filtro || filtro(u)).slice().sort((a, b) => String(a.sigla).localeCompare(String(b.sigla), 'pt-BR'))
      .map(u => `<option value="${u.id}"${u.id===sel?' selected':''}>${esc(u.sigla)} — ${esc(String(u.nome).replace(/^[^–]*–\s*/, ''))}</option>`).join('');
  }
  function formInstrumento(det, idDfdOrigem) {
    const i = (det && det.instrumento) || {};
    const dfd = idDfdOrigem ? _dados.instrumentos.find(x => x.id_instrumento === idDfdOrigem) : null;
    if (dfd) Object.assign(i, { tipo: 'ata', objeto: dfd.objeto, processo_sei: dfd.processo_sei, id_processo_origem: dfd.id_instrumento });
    const usado = !!(det && det.requisicoes && det.requisicoes.length);
    window._f = {
      i, usado, edit: !!i.id_instrumento,
      partes: (i.participantes || []).map(p => ({ id_polo: p.id_polo, id_unidade_gestora: p.id_unidade_gestora })),
      itens: det && det.itens ? det.itens.map(x => ({ ...x })) : [],
      gerenciador: i.id_polo || null,
    };
    if (!_f.partes.length) _f.partes = [{ id_polo: dfd ? dfd.id_polo : (_ctx.meu_polo || (_ctx.polos[0] || {}).id), id_unidade_gestora: '' }];
    const dfds = _dados.instrumentos.filter(p => p.tipo === 'dfd' && (['em_elaboracao','em_contratacao'].includes(p.situacao) || p.id_instrumento === i.id_processo_origem));
    abrirModal(i.id_instrumento ? `Editar ${esc(TIPOS_INST[i.tipo])} ${esc(i.numero)}` : dfd ? `Contrato ou ata do DFD ${esc(dfd.numero)}` : 'Novo instrumento', `
      <div class="form">
        <div class="campo"><label>Tipo *</label><select id="in-tipo" onchange="ajustarTipo()" ${i.id_instrumento ? 'disabled' : ''}>${Object.entries(TIPOS_INST).filter(([k]) => !dfd || k !== 'dfd').map(([k, v]) => `<option value="${k}"${k===(i.tipo||'ata')?' selected':''}>${v}</option>`).join('')}</select></div>
        <div class="campo"><label id="in-num-lbl">Número *</label><input id="in-num" value="${esc(i.numero||'')}"></div>
        <div class="campo"><label>Situação</label><select id="in-sit"></select></div>
        <div class="campo largo"><label>Objeto *</label><input id="in-obj" value="${esc(i.objeto||'')}"></div>
        <div class="campo so-inst"><label>Fornecedor — CNPJ</label><input id="in-cnpj" value="${esc(i.fornecedor_cnpj||'')}"></div>
        <div class="campo so-inst"><label>Fornecedor — nome</label><input id="in-forn" value="${esc(i.fornecedor_nome||'')}"></div>
        <div class="campo so-inst"><label>Vigência — início</label><input type="date" id="in-vi" value="${esc(i.vigencia_inicio||'')}"></div>
        <div class="campo so-inst"><label>Vigência — fim</label><input type="date" id="in-vf" value="${esc(i.vigencia_fim||'')}"></div>
        <div class="campo so-dfd"><label>Data do DFD</label><input type="date" id="in-ddfd" value="${esc(i.data_dfd||'')}"></div>
        <div class="campo so-dfd"><label>Unidade demandante *</label><select id="in-dem"><option value="">Selecione…</option>${opcoesUnidades(i.id_unidade_demandante)}</select></div>
        <div class="campo so-dfd"><label>Valor estimado (R$)</label><input type="number" min="0" step="0.01" id="in-vest" value="${i.valor_estimado ?? ''}"></div>
        <div class="campo"><label>Processo SUAP</label><input id="in-sei" value="${esc(i.processo_sei||'')}"></div>
        <div class="campo so-orig largo"><label>Gerado a partir do DFD</label><select id="in-orig" ${dfd ? 'disabled' : ''}><option value="">Nenhum</option>${dfds.map(p => `<option value="${p.id_instrumento}"${p.id_instrumento===i.id_processo_origem?' selected':''}>${esc(p.numero)} · ${esc(p.objeto)} · ${esc(siglaPolo(p.id_polo))}</option>`).join('')}</select>
          <span class="hint">Ao salvar, o DFD fica concluído e as requisições que aguardavam voltam para as seções escolherem os itens e as quantidades.</span></div>
        <div class="campo largo"><label>Observação</label><input id="in-obs" value="${esc(i.observacao||'')}"></div>
      </div>
      <div class="bloco so-inst" style="margin-top:18px"><div class="bloco-titulo">Participantes (polo e seção gestora)
          <button class="btn btn-mini so-ata" onclick="addParte()">+ Participante</button></div>
        <div id="in-partes"></div>
        <span class="hint" style="font-size:11px;color:#888780">Cada seção só requisita dos contratos e atas do seu polo (Reitoria ou o seu campus). O gestor de cada polo aprova as requisições do polo e controla as quantidades dele.</span></div>
      <div class="bloco so-inst"><div class="bloco-titulo">Itens
          <button class="btn btn-mini" onclick="addItem()">+ Item</button>
          <button class="btn btn-mini" onclick="toggleColar()">Colar da planilha</button></div>
        ${usado ? '<div class="info" style="margin-bottom:8px">Este instrumento já tem requisições: preço e quantidade dos itens existentes só mudam por <b>Registrar alteração</b> (aditivo ou apostilamento). Itens novos podem ser incluídos aqui.</div>' : ''}
        <div id="in-colar" style="display:none;margin-bottom:10px">
          <div class="info" style="margin-bottom:8px" id="in-colar-modelo"></div>
          <textarea id="in-colar-txt" rows="6" style="width:100%;padding:8px;border:1px solid #D3D1C7;border-radius:7px;font-family:Consolas,monospace;font-size:12px" placeholder="Cole aqui as linhas copiadas do Excel"></textarea>
          <div class="rodape" style="margin-top:6px"><label style="font-size:12px;margin-right:auto"><input type="checkbox" id="in-colar-subst"> Substituir os itens já digitados</label>
            <button class="btn btn-mini" onclick="toggleColar()">Fechar</button><button class="btn btn-mini btn-p" onclick="importarColado()">Importar linhas</button></div>
        </div>
        <div class="caixa tabela-scroll"><table class="tab-itens"><thead id="in-itens-cab"></thead><tbody id="in-itens"></tbody></table></div>
        <div id="in-itens-tot" style="margin-top:6px;font-size:12.5px;text-align:right"></div></div>
      <div class="rodape"><button class="btn" onclick="${i.id_instrumento ? 'fichaInstrumento()' : 'fecharModal()'}">Voltar</button>
        <button class="btn btn-p" id="in-salvar" onclick="salvarInstrumento()">Salvar</button></div>`, true);
    $('modal').classList.add('extra');
    ajustarTipo();
  }
  function tipoAtual() { return $('in-tipo').value; }
  function ajustarTipo() {
    const t = tipoAtual(), i = _f.i;
    document.querySelectorAll('.so-inst').forEach(e => e.style.display = t === 'dfd' ? 'none' : '');
    document.querySelectorAll('.so-orig').forEach(e => e.style.display = t === 'dfd' || i.id_instrumento ? 'none' : '');
    document.querySelectorAll('.so-dfd').forEach(e => e.style.display = t === 'dfd' ? '' : 'none');
    document.querySelectorAll('.so-ata').forEach(e => e.style.display = t === 'ata' ? '' : 'none');
    $('in-num-lbl').textContent = t === 'dfd' ? 'Número do DFD *' : (t === 'ata' ? 'Número da ata *' : 'Número do contrato *');
    const ops = t === 'dfd' ? ['em_elaboracao', 'em_contratacao', 'cancelado'].concat(i.situacao === 'concluido' ? ['concluido'] : []) : ['vigente', 'encerrado'];
    const cur = i.situacao && ops.includes(i.situacao) ? i.situacao : ops[0];
    $('in-sit').innerHTML = ops.map(s => `<option value="${s}"${s===cur?' selected':''}>${SIT_INST[s]}</option>`).join('');
    if (t === 'contrato' && _f.partes.length > 1) _f.partes = _f.partes.slice(0, 1);
    if (t !== 'dfd') { desenharPartes(); desenharItens(); }
  }
  // Participantes
  function desenharPartes() {
    const t = tipoAtual();
    if (!_f.gerenciador || !_f.partes.some(p => p.id_polo === _f.gerenciador)) _f.gerenciador = (_f.partes[0] || {}).id_polo;
    $('in-partes').innerHTML = `<div class="caixa"><table><thead><tr>${t === 'ata' ? '<th style="width:90px">Gerenciador</th>' : ''}<th>Polo</th><th>Seção gestora do polo</th><th></th></tr></thead><tbody>
      ${_f.partes.map((p, k) => `<tr>
        ${t === 'ata' ? `<td><input type="radio" name="in-ger" ${p.id_polo === _f.gerenciador ? 'checked' : ''} onchange="_f.gerenciador=_f.partes[${k}].id_polo"></td>` : ''}
        <td><select data-sem-busca onchange="mudarPolo(${k}, this.value)">${(_ctx.polos||[]).map(x => `<option value="${x.id}"${x.id===p.id_polo?' selected':''}>${esc(x.nome.startsWith('Reitoria') ? x.nome : x.sigla + ' — ' + String(x.nome).replace(/^[^–]*–\s*/, ''))}</option>`).join('')}</select></td>
        <td><select onchange="_f.partes[${k}].id_unidade_gestora=this.value"><option value="">Selecione…</option>${opcoesUnidades(p.id_unidade_gestora, u => u.polo === p.id_polo)}</select></td>
        <td style="text-align:right">${t === 'ata' && _f.partes.length > 1 ? `<button class="btn btn-mini btn-r" onclick="removerParte(${k})">Remover</button>` : ''}</td></tr>`).join('')}
    </tbody></table></div>`;
  }
  function mudarPolo(k, polo) {
    if (_f.partes.some((p, j) => j !== k && p.id_polo === polo)) { toast('Este polo já está na lista.'); desenharPartes(); return; }
    const ant = _f.partes[k].id_polo;
    _f.partes[k] = { id_polo: polo, id_unidade_gestora: '' };
    _f.itens.forEach(it => { it.quantidades = it.quantidades || {}; if (ant in it.quantidades) { it.quantidades[polo] = it.quantidades[ant]; delete it.quantidades[ant]; } });
    if (_f.gerenciador === ant) _f.gerenciador = polo;
    desenharPartes(); desenharItens();
  }
  function addParte() {
    const livre = (_ctx.polos || []).find(x => !_f.partes.some(p => p.id_polo === x.id));
    if (!livre) { toast('Todos os polos já participam.'); return; }
    _f.partes.push({ id_polo: livre.id, id_unidade_gestora: '' }); desenharPartes(); desenharItens();
  }
  function removerParte(k) { _f.partes.splice(k, 1); desenharPartes(); desenharItens(); }
  // Itens
  function addItem() {
    lerItens();
    const ult = _f.itens[_f.itens.length - 1];
    _f.itens.push({ grupo: ult ? ult.grupo || '' : '', numero_item: String((Number(ult && ult.numero_item) || _f.itens.length) + 1), descricao: '', unidade_medida: '', valor_unitario: '', natureza_despesa: ult ? ult.natureza_despesa || '' : '', quantidades: {} });
    desenharItens();
    const linhas = document.querySelectorAll('#in-itens tr'); const l = linhas[linhas.length - 1]; if (l) { const d = l.querySelector('[data-k="descricao"]'); if (d) d.focus(); }
  }
  function removerItem(k) { lerItens(); _f.itens.splice(k, 1); desenharItens(); }
  function desenharItens() {
    const P = _f.partes;
    $('in-itens-cab').innerHTML = `<tr><th style="width:60px">Grupo</th><th style="width:60px">Item</th><th>Descrição *</th><th style="width:90px">Unidade *</th><th class="num" style="width:120px">Valor unit. (R$) *</th><th style="width:100px">ND</th>
      ${P.map(p => `<th class="num" style="width:95px">Qtd. ${esc(siglaPolo(p.id_polo))}</th>`).join('')}<th></th></tr>`;
    const trava = it => _f.usado && it.id_item;
    $('in-itens').innerHTML = _f.itens.map((it, k) => `<tr data-i="${k}">
      <td><input data-k="grupo" value="${esc(it.grupo||'')}"></td>
      <td><input data-k="numero_item" value="${esc(it.numero_item||'')}"></td>
      <td><input data-k="descricao" value="${esc(it.descricao||'')}"></td>
      <td><input data-k="unidade_medida" value="${esc(it.unidade_medida||'')}"></td>
      <td><input data-k="valor_unitario" class="num" value="${it.valor_unitario === '' || it.valor_unitario == null ? '' : String(it.valor_unitario).replace('.', ',')}" ${trava(it) ? 'disabled title="Use Registrar alteração (reajuste)"' : ''} oninput="totalItens()"></td>
      <td><input data-k="natureza_despesa" value="${esc(it.natureza_despesa||'')}" placeholder="3.3.90.30"></td>
      ${P.map(p => `<td><input data-q="${p.id_polo}" class="num" value="${it.quantidades && it.quantidades[p.id_polo] != null ? String(it.quantidades[p.id_polo]).replace('.', ',') : ''}" ${trava(it) ? 'disabled title="Use Registrar alteração (acréscimo ou supressão)"' : ''} oninput="totalItens()"></td>`).join('')}
      <td>${trava(it) ? '' : `<button class="btn btn-mini btn-r" onclick="removerItem(${k})" title="Remover item">×</button>`}</td></tr>`).join('')
      || `<tr><td colspan="${7 + P.length}" class="vazio" style="padding:14px">Nenhum item. Use “+ Item” ou “Colar da planilha”.</td></tr>`;
    totalItens();
  }
  function lerItens() {
    document.querySelectorAll('#in-itens tr[data-i]').forEach(tr => {
      const it = _f.itens[Number(tr.dataset.i)]; if (!it) return;
      tr.querySelectorAll('[data-k]').forEach(inp => { it[inp.dataset.k] = inp.dataset.k === 'valor_unitario' ? (inp.value.trim() === '' ? '' : numBR(inp.value)) : inp.value.trim(); });
      it.quantidades = it.quantidades || {};
      tr.querySelectorAll('[data-q]').forEach(inp => { it.quantidades[inp.dataset.q] = inp.value.trim() === '' ? 0 : numBR(inp.value); });
    });
  }
  function totalItens() {
    lerItens();
    const tot = _f.itens.reduce((t, it) => t + Number(it.valor_unitario || 0) * Object.values(it.quantidades || {}).reduce((a, b) => a + Number(b || 0), 0), 0);
    const el = $('in-itens-tot'); if (el) el.innerHTML = `${_f.itens.length} item(ns) · valor total <b>${fmtV(tot)}</b>`;
  }
  function toggleColar() {
    const b = $('in-colar'); b.style.display = b.style.display === 'none' ? '' : 'none';
    $('in-colar-modelo').innerHTML = `Copie do Excel as linhas com as colunas nesta ordem (sem precisar da linha de títulos):<br>
      <b>Grupo · Item · Descrição · Unidade · Valor unitário · Natureza de despesa (pode ficar vazia)${_f.partes.map(p => ' · Qtd. ' + esc(siglaPolo(p.id_polo))).join('')}</b>`;
  }
  function importarColado() {
    lerItens();
    const txt = $('in-colar-txt').value.replace(/\r/g, '');
    const linhas = txt.split('\n').map(l => l.split('\t')).filter(c => c.some(x => x.trim()));
    if (!linhas.length) { toast('Nada para importar.'); return; }
    const novos = [], erros = [];
    linhas.forEach((c, n) => {
      const vu = numBR(c[4] || '');
      if (n === 0 && !vu && /grupo|item|descri/i.test(c.join(' '))) return;   // linha de títulos
      const it = { grupo: (c[0] || '').trim(), numero_item: (c[1] || '').trim(), descricao: (c[2] || '').trim(), unidade_medida: (c[3] || '').trim(),
                   valor_unitario: vu || '', natureza_despesa: (c[5] || '').trim(), quantidades: {} };
      _f.partes.forEach((p, k) => { it.quantidades[p.id_polo] = numBR(c[6 + k] || '') || 0; });
      if (!it.descricao || !it.numero_item) erros.push(n + 1); else novos.push(it);
    });
    if ($('in-colar-subst').checked) _f.itens = _f.itens.filter(it => _f.usado && it.id_item);
    _f.itens = _f.itens.concat(novos);
    desenharItens(); $('in-colar').style.display = 'none'; $('in-colar-txt').value = '';
    toast(`${novos.length} item(ns) importado(s)` + (erros.length ? `; ${erros.length} linha(s) sem item ou descrição ignorada(s)` : '') + '.');
  }
  async function salvarInstrumento() {
    const t = tipoAtual(), i = _f.i;
    const inst = { id_instrumento: i.id_instrumento || null, tipo: t, numero: $('in-num').value.trim(), objeto: $('in-obj').value.trim(),
      processo_sei: $('in-sei').value.trim(), situacao: $('in-sit').value, observacao: $('in-obs').value.trim() };
    if (!inst.numero) return erroModal('Informe o número.');
    if (!inst.objeto) return erroModal('Informe o objeto.');
    let partes = null, itens = null;
    if (t === 'dfd') {
      Object.assign(inst, { data_dfd: $('in-ddfd').value, id_unidade_demandante: $('in-dem').value, valor_estimado: $('in-vest').value });
      if (!inst.id_unidade_demandante) return erroModal('Escolha a unidade demandante.');
    } else {
      Object.assign(inst, { fornecedor_cnpj: $('in-cnpj').value.trim(), fornecedor_nome: $('in-forn').value.trim(),
        vigencia_inicio: $('in-vi').value, vigencia_fim: $('in-vf').value, id_polo: _f.gerenciador });
      if (!i.id_instrumento && $('in-orig').value) inst.id_processo_origem = $('in-orig').value;
      const ano = d => Number(String(d).slice(0, 4));
      for (const [d, nome] of [[inst.vigencia_inicio, 'início'], [inst.vigencia_fim, 'fim']])
        if (d && (ano(d) < 2000 || ano(d) > 2100)) return erroModal(`Confira o ano da vigência (${nome}): ${fmtD(d)}.`);
      if (inst.vigencia_inicio && inst.vigencia_fim && inst.vigencia_fim < inst.vigencia_inicio)
        return erroModal(`A vigência termina (${fmtD(inst.vigencia_fim)}) antes de começar (${fmtD(inst.vigencia_inicio)}). Confira as datas.`);
      partes = _f.partes;
      if (partes.some(p => !p.id_unidade_gestora)) return erroModal('Escolha a seção gestora de cada polo.');
      lerItens();
      itens = _f.itens.map(it => ({ id_item: it.id_item || null, grupo: it.grupo || '', numero_item: it.numero_item, descricao: it.descricao,
        unidade_medida: it.unidade_medida, valor_unitario: it.valor_unitario, natureza_despesa: it.natureza_despesa || '',
        quantidades: Object.fromEntries(partes.map(p => [p.id_polo, Number((it.quantidades || {})[p.id_polo] || 0)])) }));
      if (!itens.length) return erroModal('Cadastre ao menos um item.');
      const ruim = itens.findIndex(it => !it.numero_item || !it.descricao || !it.unidade_medida || !(Number(it.valor_unitario) > 0));
      if (ruim >= 0) return erroModal(`Item na linha ${ruim + 1}: preencha item, descrição, unidade e valor unitário.`);
    }
    $('in-salvar').disabled = true;
    const r = await chamar('inst_salvar', { instrumento: inst, participantes: partes, itens });
    $('in-salvar').disabled = false;
    if (!r.ok) return erroModal(r.erro);
    toast('Instrumento salvo.'); await carregar(); abrirInstrumento(r.id_instrumento);
  }
  async function excluirInstrumento(id) {
    if (!confirm('Excluir este instrumento?')) return;
    const r = await chamar('inst_excluir', { id_instrumento: id });
    if (!r.ok) return erroModal(r.erro);
    fecharModal(); toast('Instrumento excluído.'); carregar();
  }

  // ── Aditivo, apostilamento ou correção ────────────────────────────────────
  function formAlteracao() {
    const { instrumento: i } = window._det;
    abrirModal(`Registrar alteração — ${esc(TIPOS_INST[i.tipo])} ${esc(i.numero)}`, `
      <div class="form">
        <div class="campo"><label>Tipo *</label><select id="al-tipo" onchange="desenharAlteracao()" data-sem-busca>
          <option value="acrescimo">Acréscimo de quantidade</option><option value="supressao">Supressão de quantidade</option>
          <option value="reajuste">Reajuste de preço</option><option value="correcao">Correção de quantidade ou preço</option></select></div>
        <div class="campo"><label>Documento *</label><input id="al-doc" placeholder="Termo aditivo nº…, apostilamento nº…"></div>
        <div class="campo"><label>Data</label><input type="date" id="al-data" value="${new Date().toISOString().slice(0, 10)}"></div>
        <div class="campo largo"><label>Observação</label><input id="al-obs"></div>
      </div>
      <div class="bloco" style="margin-top:14px"><div class="bloco-titulo">Preencha só o que muda</div><div class="caixa tabela-scroll" id="al-itens"></div>
        <div id="al-aviso" style="margin-top:8px"></div></div>
      <div class="rodape"><button class="btn" onclick="fichaInstrumento()">Voltar</button><button class="btn btn-p" id="al-salvar" onclick="salvarAlteracao()">Registrar</button></div>`, true);
    $('modal').classList.add('extra');
    desenharAlteracao();
  }
  function desenharAlteracao() {
    const { instrumento: i, itens, saldos } = window._det, t = $('al-tipo').value;
    const P = i.participantes || [];
    const preco = t === 'reajuste' || t === 'correcao', qtd = t !== 'reajuste';
    $('al-itens').innerHTML = `<table class="tab-itens"><thead><tr><th>Item</th><th>Descrição</th>${preco ? '<th class="num">Preço atual</th><th class="num" style="width:130px">Novo preço</th>' : ''}
        ${qtd ? P.map(p => `<th class="num">${esc(siglaPolo(p.id_polo))}<br><small>atual · aprovado</small></th><th class="num" style="width:100px">Nova qtd.</th>`).join('') : ''}</tr></thead><tbody>
      ${itens.map(it => `<tr data-item="${it.id_item}"><td style="white-space:nowrap">${it.grupo ? 'G' + esc(it.grupo) + ' · ' : ''}<b>${esc(it.numero_item)}</b></td><td style="max-width:260px">${esc(it.descricao)}<span class="sub">${esc(it.unidade_medida)}</span></td>
        ${preco ? `<td class="num">${fmtV4(it.valor_unitario)}</td><td><input data-preco class="num" oninput="avisoAlteracao()"></td>` : ''}
        ${qtd ? P.map(p => { const s = saldos.find(x => x.id_item === it.id_item && x.id_polo === p.id_polo) || { registrado: 0, aprovado: 0 };
          return `<td class="num">${fmtN(s.registrado)} · ${fmtN(s.aprovado)}</td><td><input data-polo="${p.id_polo}" data-atual="${s.registrado}" data-apr="${s.aprovado}" class="num" oninput="avisoAlteracao()"></td>`; }).join('') : ''}</tr>`).join('')}
    </tbody></table>`;
    avisoAlteracao();
  }
  function avisoAlteracao() {
    const t = $('al-tipo').value, msgs = [];
    document.querySelectorAll('#al-itens input[data-polo]').forEach(inp => {
      if (inp.value.trim() === '') return;
      const novo = numBR(inp.value), atual = Number(inp.dataset.atual), apr = Number(inp.dataset.apr);
      const it = inp.closest('tr').querySelector('b').textContent;
      if (novo < apr) msgs.push(`Item ${it}: não pode ficar abaixo do já aprovado (${fmtN(apr)}).`);
      if (t === 'acrescimo' && novo <= atual) msgs.push(`Item ${it}: acréscimo precisa aumentar a quantidade.`);
      if (t === 'supressao' && novo >= atual) msgs.push(`Item ${it}: supressão precisa reduzir a quantidade.`);
      if (atual && Math.abs(novo - atual) / atual > 0.25 + 1e-9) msgs.push(`Item ${it}: variação de ${Math.round(Math.abs(novo - atual) / atual * 100)}% — confira o limite legal de acréscimos e supressões.`);
    });
    $('al-aviso').innerHTML = msgs.length ? `<div class="bad-box">${msgs.map(esc).join('<br>')}</div>` : '';
  }
  async function salvarAlteracao() {
    const { instrumento: i } = window._det, t = $('al-tipo').value;
    const itens = [];
    document.querySelectorAll('#al-itens tr[data-item]').forEach(tr => {
      const idItem = tr.dataset.item;
      const pr = tr.querySelector('[data-preco]');
      if (pr && pr.value.trim() !== '') itens.push({ id_item: idItem, valor_unitario: numBR(pr.value) });
      tr.querySelectorAll('[data-polo]').forEach(inp => { if (inp.value.trim() !== '') itens.push({ id_item: idItem, id_polo: inp.dataset.polo, quantidade: numBR(inp.value) }); });
    });
    if (!itens.length) return erroModal('Preencha ao menos um novo preço ou quantidade.');
    if ($('al-doc').value.trim().length < 3) return erroModal('Informe o documento (termo aditivo, apostilamento…).');
    $('al-salvar').disabled = true;
    const r = await chamar('inst_alterar', { id_instrumento: i.id_instrumento, tipo: t, itens, documento: $('al-doc').value.trim(), data: $('al-data').value, observacao: $('al-obs').value.trim() });
    $('al-salvar').disabled = false;
    if (!r.ok) return erroModal(r.erro);
    toast('Alteração registrada.'); await carregar(); abrirInstrumento(i.id_instrumento);
  }

</script>
</body>
</html>
